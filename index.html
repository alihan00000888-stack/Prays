<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKA — Меню и Заказ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff9f0a;
            --text-main: #f2f2f7;
            --text-sub: #a1a1a6;
            --border-color: #2c2c30;
            --danger-color: #ff453a;
            --success-color: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* HEADER */
        header {
            background: linear-gradient(180deg, #1c1c1e 0%, var(--bg-color) 100%);
            padding: 22px 16px 12px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        /* ==== ЛОГОТИП — ПРОСТО ТЕКСТ FISHKA ==== */
        .logo-text {
            font-family: 'Helvetica Neue', 'Segoe UI', Arial, sans-serif;
            font-size: 34px;
            font-weight: 200;          /* тонкий шрифт */
            letter-spacing: 10px;      /* широкая разрядка */
            text-transform: uppercase;
            color: var(--text-main);
            margin-bottom: 8px;
            padding-left: 10px;        /* компенсация letter-spacing */
            line-height: 1.1;
        }

        .table-badge {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* CATEGORIES NAV */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* MENU */
        .menu-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .group-header {
            font-size: 22px;
            font-weight: 900;
            margin: 24px 0 12px;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.5px;
        }

        .group-header:first-child { margin-top: 0; }

        .group-header::before {
            content: '';
            display: inline-block;
            width: 5px;
            height: 24px;
            background: var(--accent-color);
            border-radius: 3px;
        }

        .group-count {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 500;
            margin-left: auto;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .food-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2c2c2e;
        }

        .food-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .food-name {
            font-size: 17px;
            font-weight: 700;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
        }

        .counter-controls {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-val {
            padding: 0 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* CART BAR */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background-color: var(--accent-color);
            color: #000;
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(255, 159, 10, 0.3);
            z-index: 99;
            cursor: pointer;
            font-weight: 800;
        }

        /* ADMIN */
        .admin-trigger {
            position: fixed;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            opacity: 0.2;
            font-size: 18px;
            color: #fff;
            z-index: 101;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-field, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-close { background: #3a3a3c; color: #fff; }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-card div { margin: 0 auto; }
    </style>
</head>
<body>

    <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>

    <header>
        <div class="logo-text">Fishka</div>
        <div class="table-badge" id="tableBadge">Столик №1</div>
    </header>

    <nav class="categories-scroll" id="categoriesNav"></nav>

    <main class="menu-container" id="menuContainer"></main>

    <div class="cart-bar" id="cartBar" style="display: none;" onclick="sendOrderToWhatsApp()">
        <div><span id="cartCount">0</span> позиций</div>
        <div>Отправить заказ в WhatsApp ➔</div>
        <div id="cartTotal">0 ₽</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px;">Панель Управления</h2>
            
            <div id="authBlock">
                <p>Введите пароль администратора:</p>
                <input type="password" id="adminPassword" class="input-field" placeholder="Пароль">
                <button class="btn-action" onclick="checkAdminPassword()">Войти</button>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Закрыть</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button class="btn-action" onclick="showAdminTab('editor')">Редактор Меню</button>
                    <button class="btn-action" onclick="showAdminTab('qr')">QR-коды (40 столов)</button>
                </div>

                <div id="tabEditor">
                    <h3>Добавить / Изменить блюдо</h3>
                    <input type="hidden" id="editIndex">
                    <input type="text" id="editName" class="input-field" placeholder="Название блюда">
                    <input type="number" id="editPrice" class="input-field" placeholder="Цена (руб)">
                    <input type="text" id="editTime" class="input-field" placeholder="Время готовки (~15 мин)">
                    <select id="editCategory" class="input-field"></select>
                    <p style="font-size: 12px; color: var(--text-sub);">Загрузить фото из памяти устройства:</p>
                    <input type="file" id="editImageFile" accept="image/*" class="input-field">
                    
                    <button class="btn-action" onclick="saveFoodItem()">Сохранить позицию</button>
                    <button class="btn-action btn-close" onclick="resetEditForm()">Очистить форму</button>
                    <hr style="border-color: var(--border-color); margin: 16px 0;">
                    
                    <h3>Текущее меню</h3>
                    <div id="adminFoodList" style="margin-top: 10px;"></div>
                </div>

                <div id="tabQR" style="display: none;">
                    <h3>QR-коды для 40 столиков</h3>
                    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">Распечатайте и наклейте на соответствующие столики:</p>
                    <div class="qr-grid" id="qrGrid"></div>
                </div>

                <br>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Выйти из админки</button>
            </div>
        </div>
    </div>

    <script>
        const PHONE_NUMBER = "79681755402";
        
        const initialMenu = [
            { name: "Горячий шик", price: 300, time: "~15-20 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" },
            { name: "Филадельфия", price: 300, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500" },
            { name: "Гамбургер куриный", price: 130, time: "~10 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { name: "Хот-дог", price: 120, time: "~7 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500" },
            { name: "Пицца Маргарита", price: 400, time: "~20 мин", cat: "Пицца", img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500" },
            { name: "Пицца Пепперони", price: 450, time: "~20 мин", cat: "Пицца", img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500" },
            { name: "Шаурма", price: 200, time: "~10 мин", cat: "Восточная кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500" },
            { name: "Цезарь с курицей", price: 300, time: "~12 мин", cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" },
            { name: "Борщ домашний", price: 250, time: "~15 мин", cat: "Домашняя кухня", img: "https://images.unsplash.com/photo-1547592180-85f173990554?w=500" },
            { name: "Пельмени", price: 280, time: "~12 мин", cat: "Домашняя кухня", img: "https://images.unsplash.com/photo-1600891964092-4316c288032e?w=500" },
            { name: "Американо", price: 150, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" }
        ];

        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let activeCategory = "Все";
        let currentTable = 1;

        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) currentTable = tableParam;
            document.getElementById('tableBadge').innerText = `Столик №${currentTable}`;
        }

        function getCategories() {
            const cats = [];
            menuData.forEach(item => {
                if (!cats.includes(item.cat)) cats.push(item.cat);
            });
            return cats;
        }

        function renderCategories() {
            const categories = ["Все", ...getCategories()];
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            const editCatSelect = document.getElementById('editCategory');
            editCatSelect.innerHTML = getCategories().map(c => `<option value="${c}">${c}</option>`).join('');
            editCatSelect.innerHTML += `<option value="Новая">+ Добавить новую категорию</option>`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderFoodCard(item, globalIndex) {
            const qty = cart[globalIndex] || 0;
            return `
            <div class="food-card">
                <img src="${item.img}" class="food-img" alt="${item.name}">
                <div class="food-info">
                    <div class="food-name">${item.name}</div>
                    <div class="food-meta">
                        <span>⏱ ${item.time || '~15 мин'}</span>
                        <span>${item.cat}</span>
                    </div>
                    <div class="food-bottom">
                        <div class="food-price">${item.price} ₽</div>
                        ${qty > 0 ? `
                            <div class="counter-controls">
                                <button class="btn-qty" onclick="updateQty(${globalIndex}, -1)">-</button>
                                <span class="qty-val">${qty}</span>
                                <button class="btn-qty" onclick="updateQty(${globalIndex}, 1)">+</button>
                            </div>
                        ` : `
                            <button class="btn-add" onclick="updateQty(${globalIndex}, 1)">Добавить</button>
                        `}
                    </div>
                </div>
            </div>
            `;
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');

            if (activeCategory === "Все") {
                const cats = getCategories();
                let html = '';

                cats.forEach(cat => {
                    const itemsInCat = menuData
                        .map((item, idx) => ({ item, idx }))
                        .filter(({ item }) => item.cat === cat);

                    if (itemsInCat.length === 0) return;

                    html += `
                        <div class="group-header">
                            ${cat}
                            <span class="group-count">${itemsInCat.length} поз.</span>
                        </div>
                    `;

                    itemsInCat.forEach(({ item, idx }) => {
                        html += renderFoodCard(item, idx);
                    });
                });

                container.innerHTML = html;
            } else {
                const itemsInCat = menuData
                    .map((item, idx) => ({ item, idx }))
                    .filter(({ item }) => item.cat === activeCategory);

                container.innerHTML = itemsInCat.map(({ item, idx }) => renderFoodCard(item, idx)).join('');
            }
        }

        function updateQty(index, delta) {
            cart[index] = (cart[index] || 0) + delta;
            if (cart[index] <= 0) delete cart[index];
            renderMenu();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;

            for (let idx in cart) {
                totalCount += cart[idx];
                totalPrice += cart[idx] * menuData[idx].price;
            }

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function sendOrderToWhatsApp() {
            let orderText = `📍 *ЗАКАЗ — СТОЛИК №${currentTable}*\n\n`;
            let totalPrice = 0;

            for (let idx in cart) {
                const item = menuData[idx];
                const itemTotal = item.price * cart[idx];
                totalPrice += itemTotal;
                orderText += `• ${item.name} x${cart[idx]} = ${itemTotal} ₽\n`;
            }

            orderText += `\n💰 *Итого к оплате:* ${totalPrice} ₽`;
            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
        }

        function openAdminModal() { document.getElementById('adminModal').style.display = 'block'; }
        function closeAdminModal() { document.getElementById('adminModal').style.display = 'none'; }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "54321") {
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminFoodList();
                generateQRCodes();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showAdminTab(tab) {
            document.getElementById('tabEditor').style.display = tab === 'editor' ? 'block' : 'none';
            document.getElementById('tabQR').style.display = tab === 'qr' ? 'block' : 'none';
        }

        function saveFoodItem() {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value);
            const time = document.getElementById('editTime').value;
            let cat = document.getElementById('editCategory').value;
            const fileInput = document.getElementById('editImageFile');
            const editIndex = document.getElementById('editIndex').value;

            if (cat === "Новая") {
                cat = prompt("Введите название новой категории:");
                if (!cat) return;
            }

            if (!name || !price) {
                alert("Заполните имя и цену!");
                return;
            }

            const processSave = (imgUrl) => {
                const itemObj = {
                    name, price, time: time || "~15 мин", cat,
                    img: imgUrl || (editIndex !== "" ? menuData[editIndex].img : "https://via.placeholder.com/300")
                };

                if (editIndex !== "") {
                    menuData[editIndex] = itemObj;
                } else {
                    menuData.push(itemObj);
                }

                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                resetEditForm();
                renderCategories();
                renderMenu();
                renderAdminFoodList();
                alert("Сохранено!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) { processSave(e.target.result); };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSave(null);
            }
        }

        function renderAdminFoodList() {
            const container = document.getElementById('adminFoodList');
            container.innerHTML = menuData.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:8px; margin-bottom:6px; border-radius:8px;">
                    <div><strong>${item.name}</strong> (${item.price} ₽) <span style="color:var(--text-sub); font-size:12px;">— ${item.cat}</span></div>
                    <div>
                        <button style="padding:4px 8px;" onclick="editFoodItem(${idx})">✏️</button>
                        <button style="padding:4px 8px; background:var(--danger-color); color:#fff; border:none; border-radius:4px;" onclick="deleteFoodItem(${idx})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function editFoodItem(idx) {
            const item = menuData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editTime').value = item.time;
            document.getElementById('editCategory').value = item.cat;
        }

        function deleteFoodItem(idx) {
            if (confirm("Удалить это блюдо?")) {
                menuData.splice(idx, 1);
                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                renderCategories();
                renderMenu();
                renderAdminFoodList();
            }
        }

        function resetEditForm() {
            document.getElementById('editIndex').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editPrice').value = "";
            document.getElementById('editTime').value = "";
            document.getElementById('editImageFile').value = "";
        }

        function generateQRCodes() {
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `<div id="qr_${i}"></div><strong style="margin-top:4px; display:block;">Стол №${i}</strong>`;
                grid.appendChild(card);

                new QRCode(document.getElementById(`qr_${i}`), {
                    text: `${baseUrl}?table=${i}`,
                    width: 100,
                    height: 100
                });
            }
        }

        // СТАРТ
        initTableNumber();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
