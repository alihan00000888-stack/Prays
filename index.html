<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKA — Меню и Заказ</title>
    <!-- Подключение QR-библиотеки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-bg: #18181c;
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.35);
            --text-main: #f2f2f7;
            --text-sub: #a1a1a6;
            --border-color: #27272a;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 95px;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ---------------------------------------------
           ФОНОВЫЕ ДЕКОРАЦИИ И ВОДЯНОЙ ЗНАК
        --------------------------------------------- */
        /* Гигантский просвечивающий логотип FISHKA на фоне */
        .bg-watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            width: 140vw;
            max-width: 900px;
            opacity: 0.035;
            pointer-events: none;
            z-index: 0;
        }

        /* Декоративные полупрозрачные тарелки и приборы по углам */
        .bg-decor {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            color: #ffffff;
        }
        .decor-plate-left {
            top: 20%;
            left: -40px;
            width: 180px;
            height: 180px;
            transform: rotate(15deg);
        }
        .decor-plate-right {
            bottom: 15%;
            right: -40px;
            width: 200px;
            height: 200px;
            transform: rotate(-20deg);
        }
        .decor-cutlery {
            top: 60%;
            left: 10px;
            width: 90px;
            height: 90px;
            transform: rotate(45deg);
        }

        /* ---------------------------------------------
           ШАПКА И ПАТТЕРН ПЯТЕН (В СТИЛЕ WHATSAPP)
        --------------------------------------------- */
        .header-banner {
            position: relative;
            background: #000000;
            background-image: radial-gradient(circle at 10% 20%, #1f2937 0%, #000 90%);
            padding: 24px 16px 16px;
            text-align: center;
            border-bottom: 2px solid var(--accent-green);
            z-index: 10;
            overflow: hidden;
        }

        /* Абстрактные фоновые пятна в шапке */
        .header-banner::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(ellipse at 15% 30%, rgba(255,255,255,0.12) 0%, transparent 40%),
                radial-gradient(ellipse at 85% 20%, rgba(34,197,94,0.15) 0%, transparent 45%),
                radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08) 0%, transparent 50%);
            pointer-events: none;
        }

        /* Аватар-кружок с логотипом-рыбой */
        .logo-circle-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid var(--accent-green);
            box-shadow: 0 0 20px var(--accent-green-glow);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px;
        }

        .logo-svg {
            width: 100%;
            height: auto;
        }

        .shop-subtext {
            font-size: 13px;
            color: var(--text-sub);
            letter-spacing: 1px;
            margin-top: 2px;
            font-weight: 500;
        }

        .table-badge {
            display: inline-block;
            background: var(--accent-green);
            color: #000;
            font-weight: 800;
            font-size: 13px;
            padding: 4px 14px;
            border-radius: 20px;
            margin-top: 8px;
            box-shadow: 0 2px 10px var(--accent-green-glow);
        }

        /* ---------------------------------------------
           КАТЕГОРИИ
        --------------------------------------------- */
        .categories-scroll {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background-color: rgba(15, 15, 18, 0.95);
            backdrop-filter: blur(10px);
            scrollbar-width: none;
            border-bottom: 1px solid var(--border-color);
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 18px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .cat-btn.active {
            background-color: var(--accent-green);
            color: #000;
            border-color: var(--accent-green);
            font-weight: 700;
            box-shadow: 0 2px 10px var(--accent-green-glow);
        }

        /* ---------------------------------------------
           СПИСОК БЛЮД И КАРТОЧКИ
        --------------------------------------------- */
        .menu-container {
            position: relative;
            z-index: 1;
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 18px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            transition: transform 0.15s ease;
        }

        .food-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            background-color: #27272a;
        }

        .food-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .food-name {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .food-price {
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-green);
        }

        /* УПРАВЛЕНИЕ КОЛИЧЕСТВОМ */
        .counter-controls {
            display: flex;
            align-items: center;
            background: #27272a;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .btn-qty {
            background: none;
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-val {
            padding: 0 8px;
            font-weight: 700;
            font-size: 15px;
            color: var(--accent-green);
        }

        .btn-add {
            background-color: var(--accent-green);
            color: #000;
            border: none;
            padding: 9px 18px;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--accent-green-glow);
        }

        /* ---------------------------------------------
           ПЛАВАЮЩАЯ ПАНЕЛЬ КОРЗИНЫ
        --------------------------------------------- */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background-color: var(--accent-green);
            color: #000;
            border-radius: 18px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 25px var(--accent-green-glow);
            z-index: 99;
            cursor: pointer;
            font-weight: 800;
        }

        /* ---------------------------------------------
           АДМИНКА И МОДАЛЬНЫЕ ОКНА
        --------------------------------------------- */
        .admin-trigger {
            position: fixed;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 16px;
            color: #fff;
            z-index: 101;
            cursor: pointer;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.88);
            z-index: 200;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-field, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            background: #27272a;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-green);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-close { background: #3f3f46; color: #fff; }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-card div { margin: 0 auto; }
    </style>
</head>
<body>

    <!-- 1. ФОНОВЫЙ ВОДЯНОЙ ЗНАК (ГИГАНТСКАЯ РЫБА FISHKA) -->
    <svg class="bg-watermark" viewBox="0 0 500 160" fill="currentColor">
        <path d="M 30,80 Q 20,20 80,20 C 130,20 120,70 120,70 C 120,70 110,120 170,120 C 230,120 220,50 280,50 C 340,50 330,110 390,110 C 440,110 450,80 450,80 L 490,40 L 475,80 L 490,120 Z" fill="none" stroke="currentColor" stroke-width="12" />
        <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="'Arial Black', sans-serif" font-weight="900" font-size="62" letter-spacing="3">FiSHKA</text>
    </svg>

    <!-- 2. ФОНОВЫЕ ДЕКОРАТИВНЫЕ ТАРЕЛКИ И ПРИБОРЫ -->
    <svg class="bg-decor decor-plate-left" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
        <circle cx="50" cy="50" r="45"/>
        <circle cx="50" cy="50" r="32" stroke-dasharray="4 4"/>
        <circle cx="50" cy="50" r="20"/>
    </svg>

    <svg class="bg-decor decor-plate-right" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="3">
        <circle cx="50" cy="50" r="45"/>
        <circle cx="50" cy="50" r="30"/>
    </svg>

    <svg class="bg-decor decor-cutlery" viewBox="0 0 100 100" fill="currentColor">
        <!-- Вилка -->
        <path d="M 25,10 L 25,40 Q 25,55 35,55 L 35,90 L 40,90 L 40,55 Q 50,55 50,40 L 50,10 L 44,10 L 44,35 L 39,35 L 39,10 L 35,10 L 35,35 L 31,35 L 31,10 Z"/>
        <!-- Нож -->
        <path d="M 65,10 Q 80,30 80,55 L 72,55 L 72,90 L 66,90 L 66,10 Z"/>
    </svg>

    <!-- КНОПКА ВХОДА В АДМИНКУ -->
    <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>

    <!-- ШАПКА В ФИРМЕННОМ СТИЛЕ WHATSAPP -->
    <header class="header-banner">
        <div class="logo-circle-container">
            <!-- Точный SVG логотип FiSHKA в форме рыбы -->
            <svg class="logo-svg" viewBox="0 0 320 110" fill="#000000">
                <g transform="translate(10, 5)">
                    <!-- Контур рыбы и буквы FiSHKA -->
                    <path d="M 0,55 C 20,10 60,5 90,25 C 120,40 140,15 180,15 C 220,15 240,40 260,30 C 275,22 280,15 285,10 L 305,55 L 285,100 C 280,95 275,88 260,80 C 240,70 220,95 180,95 C 140,95 120,70 90,85 C 60,105 20,100 0,55 Z" fill="#000000"/>
                    <text x="145" y="68" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="46" fill="#ffffff" text-anchor="middle" letter-spacing="-1">FiSHKa</text>
                </g>
            </svg>
        </div>
        <div class="shop-subtext">Шаурма • Пицца • Кура</div>
        <div class="table-badge" id="tableBadge">Столик №1</div>
    </header>

    <!-- НАВИГАЦИЯ КАТЕГОРИЙ -->
    <nav class="categories-scroll" id="categoriesNav">
        <!-- Категории генерируются через JS -->
    </nav>

    <!-- МЕНЮ -->
    <main class="menu-container" id="menuContainer">
        <!-- Блюда генерируются через JS -->
    </main>

    <!-- ПАНЕЛЬ КОРЗИНЫ -->
    <div class="cart-bar" id="cartBar" style="display: none;" onclick="sendOrderToWhatsApp()">
        <div>
            <span id="cartCount">0</span> позиций
        </div>
        <div>Отправить заказ в WhatsApp ➔</div>
        <div id="cartTotal">0 ₽</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px; color: #fff;">Панель Управления</h2>
            
            <div id="authBlock">
                <p style="color: var(--text-sub);">Введите пароль администратора:</p>
                <input type="password" id="adminPassword" class="input-field" placeholder="Пароль">
                <button class="btn-action" onclick="checkAdminPassword()">Войти</button>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Закрыть</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button class="btn-action" onclick="showAdminTab('editor')">Редактор Меню</button>
                    <button class="btn-action" onclick="showAdminTab('qr')">QR-коды (40 столов)</button>
                </div>

                <!-- Вкладка Редактора -->
                <div id="tabEditor">
                    <h3 style="color:#fff;">Добавить / Изменить блюдо</h3>
                    <input type="hidden" id="editIndex">
                    <input type="text" id="editName" class="input-field" placeholder="Название блюда">
                    <input type="number" id="editPrice" class="input-field" placeholder="Цена (руб)">
                    <input type="text" id="editTime" class="input-field" placeholder="Время готовки (~15 мин)">
                    <select id="editCategory" class="input-field">
                        <!-- Выбор категории -->
                    </select>
                    <p style="font-size: 12px; color: var(--text-sub);">Загрузить фото из памяти устройства:</p>
                    <input type="file" id="editImageFile" accept="image/*" class="input-field">
                    
                    <button class="btn-action" onclick="saveFoodItem()">Сохранить позицию</button>
                    <button class="btn-action btn-close" onclick="resetEditForm()">Очистить форму</button>
                    <hr style="border-color: var(--border-color); margin: 16px 0;">
                    
                    <h3 style="color:#fff;">Текущее меню</h3>
                    <div id="adminFoodList" style="margin-top: 10px;"></div>
                </div>

                <!-- Вкладка QR-кодов -->
                <div id="tabQR" style="display: none;">
                    <h3 style="color:#fff;">QR-коды для 40 столиков</h3>
                    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">Распечатайте и наклейте на соответствующие столики:</p>
                    <div class="qr-grid" id="qrGrid"></div>
                </div>

                <br>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Выйти из админки</button>
            </div>
        </div>
    </div>

    <script>
        // КОНФИГУРАЦИЯ И ДАННЫЕ
        const PHONE_NUMBER = "79286454745"; // Телефон из шапки аккаунта WhatsApp
        
        const initialMenu = [
            { name: "Горячий шик", price: 300, time: "~15-20 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" },
            { name: "Филадельфия", price: 300, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500" },
            { name: "Гамбургер куриный", price: 130, time: "~10 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { name: "Хот-дог", price: 120, time: "~7 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500" },
            { name: "Шаурма", price: 200, time: "~10 мин", cat: "Восточная кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500" },
            { name: "Цезарь с курицей", price: 300, time: "~12 мин", cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" },
            { name: "Американо", price: 150, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" }
        ];

        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let activeCategory = "Все";
        let currentTable = 1;

        // ПОЛУЧЕНИЕ НОМЕРА СТОЛА ИЗ URL (?table=N)
        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                currentTable = tableParam;
            }
            document.getElementById('tableBadge').innerText = `Столик №${currentTable}`;
        }

        // РЕНДЕР КАТЕГОРИЙ И МЕНЮ
        function renderCategories() {
            const categories = ["Все", ...new Set(menuData.map(item => item.cat))];
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            const editCatSelect = document.getElementById('editCategory');
            editCatSelect.innerHTML = categories.filter(c => c !== "Все").map(c => `<option value="${c}">${c}</option>`).join('');
            editCatSelect.innerHTML += `<option value="Новая">+ Добавить новую категорию</option>`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const filtered = activeCategory === "Все" ? menuData : menuData.filter(i => i.cat === activeCategory);

            container.innerHTML = filtered.map((item) => {
                const globalIndex = menuData.indexOf(item);
                const qty = cart[globalIndex] || 0;

                return `
                <div class="food-card">
                    <img src="${item.img}" class="food-img" alt="${item.name}">
                    <div class="food-info">
                        <div class="food-name">${item.name}</div>
                        <div class="food-meta">
                            <span>⏱ ${item.time || '~15 мин'}</span>
                            <span>Категория: ${item.cat}</span>
                        </div>
                        <div class="food-bottom">
                            <div class="food-price">${item.price} ₽</div>
                            ${qty > 0 ? `
                                <div class="counter-controls">
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, -1)">-</button>
                                    <span class="qty-val">${qty}</span>
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, 1)">+</button>
                                </div>
                            ` : `
                                <button class="btn-add" onclick="updateQty(${globalIndex}, 1)">Добавить</button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // КОРЗИНА И ОБНОВЛЕНИЕ
        function updateQty(index, delta) {
            cart[index] = (cart[index] || 0) + delta;
            if (cart[index] <= 0) delete cart[index];
            renderMenu();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;

            for (let idx in cart) {
                totalCount += cart[idx];
                totalPrice += cart[idx] * menuData[idx].price;
            }

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        // ОТПРАВКА В WHATSAPP
        function sendOrderToWhatsApp() {
            let orderText = `📍 *ЗАКАЗ — СТОЛИК №${currentTable}*\n\n`;
            let totalPrice = 0;

            for (let idx in cart) {
                const item = menuData[idx];
                const itemTotal = item.price * cart[idx];
                totalPrice += itemTotal;
                orderText += `• ${item.name} x${cart[idx]} = ${itemTotal} ₽\n`;
            }

            orderText += `\n💰 *Итого к оплате:* ${totalPrice} ₽`;

            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
        }

        // АДМИНКА И ПАРОЛЬ
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "54321") {
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminFoodList();
                generateQRCodes();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showAdminTab(tab) {
            document.getElementById('tabEditor').style.display = tab === 'editor' ? 'block' : 'none';
            document.getElementById('tabQR').style.display = tab === 'qr' ? 'block' : 'none';
        }

        // РЕДАКТИРОВАНИЕ И СОХРАНЕНИЕ
        function saveFoodItem() {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value);
            const time = document.getElementById('editTime').value;
            let cat = document.getElementById('editCategory').value;
            const fileInput = document.getElementById('editImageFile');
            const editIndex = document.getElementById('editIndex').value;

            if (cat === "Новая") {
                cat = prompt("Введите название новой категории:");
                if (!cat) return;
            }

            if (!name || !price) {
                alert("Заполните название и цену!");
                return;
            }

            const processSave = (imgUrl) => {
                const itemObj = {
                    name, price, time: time || "~15 мин", cat,
                    img: imgUrl || (editIndex !== "" ? menuData[editIndex].img : "https://via.placeholder.com/300")
                };

                if (editIndex !== "") {
                    menuData[editIndex] = itemObj;
                } else {
                    menuData.push(itemObj);
                }

                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                resetEditForm();
                renderCategories();
                renderMenu();
                renderAdminFoodList();
                alert("Сохранено!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processSave(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSave(null);
            }
        }

        function renderAdminFoodList() {
            const container = document.getElementById('adminFoodList');
            container.innerHTML = menuData.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#27272a; padding:8px; margin-bottom:6px; border-radius:8px;">
                    <div><strong>${item.name}</strong> (${item.price} ₽)</div>
                    <div>
                        <button style="padding:4px 8px;" onclick="editFoodItem(${idx})">✏️</button>
                        <button style="padding:4px 8px; background:var(--danger-color); color:#fff; border:none; border-radius:4px;" onclick="deleteFoodItem(${idx})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function editFoodItem(idx) {
            const item = menuData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editTime').value = item.time;
            document.getElementById('editCategory').value = item.cat;
        }

        function deleteFoodItem(idx) {
            if (confirm("Удалить это блюдо?")) {
                menuData.splice(idx, 1);
                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                renderCategories();
                renderMenu();
                renderAdminFoodList();
            }
        }

        function resetEditForm() {
            document.getElementById('editIndex').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editPrice').value = "";
            document.getElementById('editTime').value = "";
            document.getElementById('editImageFile').value = "";
        }

        // ГЕНЕРАЦИЯ 40 QR-КОДОВ
        function generateQRCodes() {
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `<div id="qr_${i}"></div><strong style="margin-top:4px; display:block;">Стол №${i}</strong>`;
                grid.appendChild(card);

                new QRCode(document.getElementById(`qr_${i}`), {
                    text: `${baseUrl}?table=${i}`,
                    width: 100,
                    height: 100
                });
            }
        }

        // СТАРТ
        initTableNumber();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
