<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKA — Меню и Заказ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Подключаем рукописный шрифт для максимального сходства с логотипом -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff9f0a;
            --text-main: #f2f2f7;
            --text-sub: #a1a1a6;
            --border-color: #2c2c30;
            --danger-color: #ff453a;
            --success-color: #30d158;
            --shark-green: #5ec269;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* HEADER & LOGO */
        header {
            background: linear-gradient(180deg, #1c1c1e 0%, var(--bg-color) 100%);
            padding: 20px 16px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        /* ====== ЛОГОТИП-АКУЛА (точная стилизация под фото) ====== */
        .logo-shark {
            display: inline-block;
            position: relative;
            margin-bottom: 6px;
            filter: drop-shadow(0 4px 14px rgba(94, 194, 105, 0.25));
            transition: transform 0.3s ease;
        }

        .logo-shark:hover {
            transform: scale(1.03);
        }

        .shark-svg {
            width: 280px;
            height: auto;
            display: block;
        }

        /* Плавное покачивание всего логотипа, как акула плывёт */
        .shark-body {
            animation: sharkSwim 4s ease-in-out infinite;
            transform-origin: center center;
        }

        @keyframes sharkSwim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-2px) rotate(-1deg); }
        }

        /* Хвост покачивается отдельно */
        .shark-tail {
            animation: tailWave 2.2s ease-in-out infinite;
            transform-origin: 60px 60px;
        }

        @keyframes tailWave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-6deg); }
        }

        /* Глаз-точка над буквой i мигает */
        .shark-eye-dot {
            animation: eyeBlink 4s infinite;
        }

        @keyframes eyeBlink {
            0%, 92%, 100% { opacity: 1; }
            95% { opacity: 0.1; }
        }

        /* Пузырьки */
        .bubble {
            animation: bubbleFloat 3.5s ease-in infinite;
        }
        .bubble:nth-child(2) { animation-delay: 1.2s; }
        .bubble:nth-child(3) { animation-delay: 2.4s; }

        @keyframes bubbleFloat {
            0% { opacity: 0; transform: translate(0, 0); }
            20% { opacity: 0.7; }
            100% { opacity: 0; transform: translate(-6px, -25px); }
        }

        .table-badge {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* CATEGORIES NAV */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* MENU LIST & CARDS */
        .menu-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 20px;
            margin: 16px 0 12px;
            color: var(--text-main);
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .food-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2c2c2e;
        }

        .food-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .food-name {
            font-size: 17px;
            font-weight: 700;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* COUNTER CONTROLS */
        .counter-controls {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-val {
            padding: 0 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* CART FLOATING BAR */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background-color: var(--accent-color);
            color: #000;
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(255, 159, 10, 0.3);
            z-index: 99;
            cursor: pointer;
            font-weight: 800;
        }

        /* ADMIN & MODAL STYLES */
        .admin-trigger {
            position: fixed;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            opacity: 0.2;
            font-size: 18px;
            color: #fff;
            z-index: 101;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-field, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-close { background: #3a3a3c; color: #fff; }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-card div { margin: 0 auto; }
    </style>
</head>
<body>

    <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>

    <header>
        <!-- ====== ЛОГОТИП-АКУЛА, ПОВТОРЯЮЩИЙ ФОРМУ С ФОТО ====== -->
        <div class="logo-shark">
            <svg class="shark-svg" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg" aria-label="FiSHKA — логотип в форме акулы">
                <defs>
                    <!-- Градиент тела акулы (зелёный, как на фото, но адаптирован) -->
                    <linearGradient id="sharkBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#5ec269"/>
                        <stop offset="50%" stop-color="#4db35a"/>
                        <stop offset="100%" stop-color="#5ec269"/>
                    </linearGradient>
                    <!-- Градиент заливки букв (оранжевый под тему сайта) -->
                    <linearGradient id="letterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" stop-color="#ffb84d"/>
                        <stop offset="100%" stop-color="#ff9f0a"/>
                    </linearGradient>
                    <!-- Свечение -->
                    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="2.5" result="blur"/>
                        <feMerge>
                            <feMergeNode in="blur"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- ===== ТЕЛО-СИЛУЭТ АКУЛЫ (охватывает все буквы) ===== -->
                <g class="shark-body">
                    <!-- Хвост (слева) — характерный плавник акулы -->
                    <g class="shark-tail">
                        <path d="M 75 55 
                                 Q 45 25 18 12 
                                 Q 40 42 22 78 
                                 Q 55 65 75 70 Z" 
                              fill="url(#sharkBodyGrad)" opacity="0.95"/>
                    </g>

                    <!-- Основное тело-контур вокруг букв -->
                    <path d="M 78 68 
                             Q 90 40 130 38 
                             Q 190 32 240 42 
                             Q 275 50 295 62 
                             Q 275 72 240 72 
                             Q 190 78 130 74 
                             Q 95 72 78 68 Z" 
                          fill="none" stroke="url(#sharkBodyGrad)" stroke-width="3" opacity="0.5"/>

                    <!-- Спинной плавник (сверху, над буквами) -->
                    <path d="M 140 38 Q 155 8 175 30 L 158 36 Z" 
                          fill="url(#sharkBodyGrad)"/>

                    <!-- Нижний плавник (маленький, снизу) -->
                    <path d="M 180 74 Q 195 88 205 76 L 192 73 Z" 
                          fill="url(#sharkBodyGrad)" opacity="0.85"/>

                    <!-- Глаз акулы (большая точка над i) -->
                    <circle cx="92" cy="42" r="6" fill="url(#sharkBodyGrad)" class="shark-eye-dot"/>
                    <circle cx="92" cy="42" r="2.5" fill="#121214"/>
                </g>

                <!-- ===== БУКВЫ FiSHKA (рукописные, как на фото) ===== -->
                <!-- Используем шрифт Pacifico — максимально похож на леттеринг с картинки -->
                <text x="78" y="80" 
                      font-family="'Pacifico', cursive" 
                      font-size="52" 
                      fill="url(#letterGrad)" 
                      filter="url(#softGlow)"
                      transform="rotate(-3, 78, 80)">F</text>
                
                <text x="112" y="80" 
                      font-family="'Pacifico', cursive" 
                      font-size="52" 
                      fill="url(#letterGrad)" 
                      filter="url(#softGlow)"
                      transform="rotate(2, 112, 80)">i</text>
                
                <text x="138" y="82" 
                      font-family="'Pacifico', cursive" 
                      font-size="56" 
                      fill="url(#letterGrad)" 
                      filter="url(#softGlow)"
                      transform="rotate(-1, 138, 82)">S</text>
                
                <text x="184" y="80" 
                      font-family="'Pacifico', cursive" 
                      font-size="52" 
                      fill="url(#letterGrad)" 
                      filter="url(#softGlow)"
                      transform="rotate(1, 184, 80)">h</text>
                
                <text x="214" y="80" 
                      font-family="'Pacifico', cursive" 
                      font-size="50" 
                      fill="url(#letterGrad)" 
                      filter="url(#softGlow)"
                      transform="rotate(-2, 214, 80)">k</text>
                
                <!-- Буква A с хвостиком, как на фото -->
                <text x="242" y="80" 
                      font-family="'Pacifico', cursive" 
                      font-size="54" 
                      fill="url(#letterGrad)" 
                      filter="url(#softGlow)"
                      transform="rotate(4, 242, 80)">A</text>

                <!-- Пузырьки воды -->
                <circle cx="30" cy="35" r="3" fill="#5ec269" class="bubble" opacity="0.6"/>
                <circle cx="20" cy="55" r="2" fill="#5ec269" class="bubble" opacity="0.5"/>
                <circle cx="300" cy="48" r="2.5" fill="#5ec269" class="bubble" opacity="0.6"/>

                <!-- Линия воды под акулой -->
                <path d="M 10 100 Q 80 94 160 98 Q 240 102 310 96" 
                      stroke="#5ec269" stroke-width="2.5" fill="none" opacity="0.55" stroke-linecap="round"/>
            </svg>
        </div>
        <!-- ====== КОНЕЦ ЛОГОТИПА ====== -->

        <div class="table-badge" id="tableBadge">Столик №1</div>
    </header>

    <nav class="categories-scroll" id="categoriesNav">
        <!-- Категории будут сгенерированы автоматически -->
    </nav>

    <main class="menu-container" id="menuContainer">
        <!-- Меню будет сгенерировано динамически -->
    </main>

    <div class="cart-bar" id="cartBar" style="display: none;" onclick="sendOrderToWhatsApp()">
        <div>
            <span id="cartCount">0</span> позиций
        </div>
        <div>Отправить заказ в WhatsApp ➔</div>
        <div id="cartTotal">0 ₽</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px;">Панель Управления</h2>
            
            <div id="authBlock">
                <p>Введите пароль администратора:</p>
                <input type="password" id="adminPassword" class="input-field" placeholder="Пароль">
                <button class="btn-action" onclick="checkAdminPassword()">Войти</button>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Закрыть</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button class="btn-action" onclick="showAdminTab('editor')">Редактор Меню</button>
                    <button class="btn-action" onclick="showAdminTab('qr')">QR-коды (40 столов)</button>
                </div>

                <!-- Вкладка Редактора -->
                <div id="tabEditor">
                    <h3>Добавить / Изменить блюдо</h3>
                    <input type="hidden" id="editIndex">
                    <input type="text" id="editName" class="input-field" placeholder="Название блюда">
                    <input type="number" id="editPrice" class="input-field" placeholder="Цена (руб)">
                    <input type="text" id="editTime" class="input-field" placeholder="Время готовки (~15 мин)">
                    <select id="editCategory" class="input-field">
                        <!-- Динамически заполняется -->
                    </select>
                    <p style="font-size: 12px; color: var(--text-sub);">Загрузить фото из памяти устройства:</p>
                    <input type="file" id="editImageFile" accept="image/*" class="input-field">
                    
                    <button class="btn-action" onclick="saveFoodItem()">Сохранить позицию</button>
                    <button class="btn-action btn-close" onclick="resetEditForm()">Очистить форму</button>
                    <hr style="border-color: var(--border-color); margin: 16px 0;">
                    
                    <h3>Текущее меню</h3>
                    <div id="adminFoodList" style="margin-top: 10px;"></div>
                </div>

                <!-- Вкладка QR-кодов -->
                <div id="tabQR" style="display: none;">
                    <h3>QR-коды для 40 столиков</h3>
                    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">Распечатайте и наклейте на соответствующие столики:</p>
                    <div class="qr-grid" id="qrGrid"></div>
                </div>

                <br>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Выйти из админки</button>
            </div>
        </div>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ ДАННЫХ
        const PHONE_NUMBER = "79681755402";
        
        const initialMenu = [
            { name: "Горячий шик", price: 300, time: "~15-20 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" },
            { name: "Филадельфия", price: 300, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500" },
            { name: "Гамбургер куриный", price: 130, time: "~10 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { name: "Хот-дог", price: 120, time: "~7 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500" },
            { name: "Шаурма", price: 200, time: "~10 мин", cat: "Восточная кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500" },
            { name: "Цезарь с курицей", price: 300, time: "~12 мин", cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" },
            { name: "Американо", price: 150, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" }
        ];

        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let activeCategory = "Все";
        let currentTable = 1;

        // ПОЛУЧЕНИЕ НОМЕРА СТОЛА ИЗ URL (?table=N)
        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                currentTable = tableParam;
            }
            document.getElementById('tableBadge').innerText = `Столик №${currentTable}`;
        }

        // РЕНДЕР КАТЕГОРИЙ И МЕНЮ
        function renderCategories() {
            const categories = ["Все", ...new Set(menuData.map(item => item.cat))];
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            // Заполнение категорий в админке
            const editCatSelect = document.getElementById('editCategory');
            editCatSelect.innerHTML = categories.filter(c => c !== "Все").map(c => `<option value="${c}">${c}</option>`).join('');
            editCatSelect.innerHTML += `<option value="Новая">+ Добавить новую категорию</option>`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const filtered = activeCategory === "Все" ? menuData : menuData.filter(i => i.cat === activeCategory);

            container.innerHTML = filtered.map((item, idx) => {
                const globalIndex = menuData.indexOf(item);
                const qty = cart[globalIndex] || 0;

                return `
                <div class="food-card">
                    <img src="${item.img}" class="food-img" alt="${item.name}">
                    <div class="food-info">
                        <div class="food-name">${item.name}</div>
                        <div class="food-meta">
                            <span>⏱ ${item.time || '~15 мин'}</span>
                            <span>Категория: ${item.cat}</span>
                        </div>
                        <div class="food-bottom">
                            <div class="food-price">${item.price} ₽</div>
                            ${qty > 0 ? `
                                <div class="counter-controls">
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, -1)">-</button>
                                    <span class="qty-val">${qty}</span>
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, 1)">+</button>
                                </div>
                            ` : `
                                <button class="btn-add" onclick="updateQty(${globalIndex}, 1)">Добавить</button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // КОРЗИНА И ОБНОВЛЕНИЕ ПОРЦИЙ
        function updateQty(index, delta) {
            cart[index] = (cart[index] || 0) + delta;
            if (cart[index] <= 0) delete cart[index];
            renderMenu();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;

            for (let idx in cart) {
                totalCount += cart[idx];
                totalPrice += cart[idx] * menuData[idx].price;
            }

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        // ОТПРАВКА В WHATSAPP
        function sendOrderToWhatsApp() {
            let orderText = `📍 *ЗАКАЗ — СТОЛИК №${currentTable}*\n\n`;
            let totalPrice = 0;

            for (let idx in cart) {
                const item = menuData[idx];
                const itemTotal = item.price * cart[idx];
                totalPrice += itemTotal;
                orderText += `• ${item.name} x${cart[idx]} = ${itemTotal} ₽\n`;
            }

            orderText += `\n💰 *Итого к оплате:* ${totalPrice} ₽`;

            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
        }

        // АДМИНКА И ПАРОЛЬ
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "54321") {
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminFoodList();
                generateQRCodes();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showAdminTab(tab) {
            document.getElementById('tabEditor').style.display = tab === 'editor' ? 'block' : 'none';
            document.getElementById('tabQR').style.display = tab === 'qr' ? 'block' : 'none';
        }

        // РЕДАКТИРОВАНИЕ И СОХРАНЕНИЕ
        function saveFoodItem() {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value);
            const time = document.getElementById('editTime').value;
            let cat = document.getElementById('editCategory').value;
            const fileInput = document.getElementById('editImageFile');
            const editIndex = document.getElementById('editIndex').value;

            if (cat === "Новая") {
                cat = prompt("Введите название новой категории:");
                if (!cat) return;
            }

            if (!name || !price) {
                alert("Заполните имя и цену!");
                return;
            }

            const processSave = (imgUrl) => {
                const itemObj = {
                    name, price, time: time || "~15 мин", cat,
                    img: imgUrl || (editIndex !== "" ? menuData[editIndex].img : "https://via.placeholder.com/300")
                };

                if (editIndex !== "") {
                    menuData[editIndex] = itemObj;
                } else {
                    menuData.push(itemObj);
                }

                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                resetEditForm();
                renderCategories();
                renderMenu();
                renderAdminFoodList();
                alert("Сохранено!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processSave(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSave(null);
            }
        }

        function renderAdminFoodList() {
            const container = document.getElementById('adminFoodList');
            container.innerHTML = menuData.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:8px; margin-bottom:6px; border-radius:8px;">
                    <div><strong>${item.name}</strong> (${item.price} ₽)</div>
                    <div>
                        <button style="padding:4px 8px;" onclick="editFoodItem(${idx})">✏️</button>
                        <button style="padding:4px 8px; background:var(--danger-color); color:#fff; border:none; border-radius:4px;" onclick="deleteFoodItem(${idx})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function editFoodItem(idx) {
            const item = menuData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editTime').value = item.time;
            document.getElementById('editCategory').value = item.cat;
        }

        function deleteFoodItem(idx) {
            if (confirm("Удалить это блюдо?")) {
                menuData.splice(idx, 1);
                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                renderCategories();
                renderMenu();
                renderAdminFoodList();
            }
        }

        function resetEditForm() {
            document.getElementById('editIndex').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editPrice').value = "";
            document.getElementById('editTime').value = "";
            document.getElementById('editImageFile').value = "";
        }

        // ГЕНЕРАЦИЯ 40 QR-КОДОВ
        function generateQRCodes() {
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `<div id="qr_${i}"></div><strong style="margin-top:4px; display:block;">Стол №${i}</strong>`;
                grid.appendChild(card);

                new QRCode(document.getElementById(`qr_${i}`), {
                    text: `${baseUrl}?table=${i}`,
                    width: 100,
                    height: 100
                });
            }
        }

        // СТАРТ
        initTableNumber();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
