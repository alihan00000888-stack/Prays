<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKA — Меню и Заказ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff9f0a;
            --text-main: #f2f2f7;
            --text-sub: #a1a1a6;
            --border-color: #2c2c30;
            --danger-color: #ff453a;
            --success-color: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        header {
            background: linear-gradient(180deg, #1c1c1e 0%, var(--bg-color) 100%);
            padding: 20px 16px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        /* ===== ЛОГОТИП: ТЕКСТ В ФОРМЕ АКУЛЫ ===== */
        .logo-shark {
            display: inline-block;
            position: relative;
            margin-bottom: 4px;
            filter: drop-shadow(0 4px 14px rgba(255, 159, 10, 0.35));
        }

        .shark-svg {
            width: 300px;
            height: auto;
            display: block;
        }

        /* Анимация плавника */
        .fin-anim {
            transform-origin: center bottom;
            animation: finPulse 3s ease-in-out infinite;
        }
        @keyframes finPulse {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-2px) rotate(-1.5deg); }
        }

        /* Анимация хвоста */
        .tail-anim {
            transform-origin: 250px 70px;
            animation: tailWave 2.8s ease-in-out infinite;
        }
        @keyframes tailWave {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(4deg); }
        }

        /* Мигающий глаз */
        .eye-blink {
            animation: blink 4.5s infinite;
        }
        @keyframes blink {
            0%, 92%, 100% { opacity: 1; }
            95% { opacity: 0; }
        }

        /* Пузырьки */
        .bub {
            animation: bubbleFloat 4s ease-in infinite;
        }
        .bub:nth-child(2) { animation-delay: 1.6s; }
        .bub:nth-child(3) { animation-delay: 2.9s; }
        @keyframes bubbleFloat {
            0% { opacity: 0; transform: translate(0, 0); }
            25% { opacity: 0.85; }
            100% { opacity: 0; transform: translate(-6px, -26px); }
        }

        .table-badge {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* CATEGORIES NAV */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* MENU LIST & CARDS */
        .menu-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 20px;
            margin: 16px 0 12px;
            color: var(--text-main);
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .food-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2c2c2e;
        }

        .food-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .food-name {
            font-size: 17px;
            font-weight: 700;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* COUNTER CONTROLS */
        .counter-controls {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-val {
            padding: 0 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* CART FLOATING BAR */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background-color: var(--accent-color);
            color: #000;
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(255, 159, 10, 0.3);
            z-index: 99;
            cursor: pointer;
            font-weight: 800;
        }

        /* ADMIN & MODAL STYLES */
        .admin-trigger {
            position: fixed;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            opacity: 0.2;
            font-size: 18px;
            color: #fff;
            z-index: 101;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-field, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-close { background: #3a3a3c; color: #fff; }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-card div { margin: 0 auto; }
    </style>
</head>
<body>

    <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>

    <header>
        <!-- ====== ЛОГОТИП: ТЕКСТ "FiSHKA" В ВИДЕ АКУЛЫ ====== -->
        <div class="logo-shark">
            <svg class="shark-svg" viewBox="0 0 340 130" xmlns="http://www.w3.org/2000/svg" aria-label="FiSHKA — логотип в форме акулы">
                <defs>
                    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="55%" stop-color="#f2f2f7"/>
                        <stop offset="100%" stop-color="#ff9f0a"/>
                    </linearGradient>
                    <linearGradient id="finGrad" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="#ff9f0a"/>
                        <stop offset="100%" stop-color="#ffc46b"/>
                    </linearGradient>
                    <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#ff9f0a"/>
                        <stop offset="100%" stop-color="#ff7a00"/>
                    </linearGradient>
                    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
                        <feGaussianBlur stdDeviation="2.2" result="b"/>
                        <feMerge>
                            <feMergeNode in="b"/>
                            <feMergeNode in="SourceGraphic"/>
                        </feMerge>
                    </filter>
                </defs>

                <!-- ===== ТЕЛО АКУЛЫ = САМ ТЕКСТ ===== -->
                <!-- Общий силуэт-обводка тела (тонкая линия, чтобы подчеркнуть форму акулы) -->
                <path d="M 8 78 
                         Q 60 58 130 62 
                         Q 200 66 270 60 
                         Q 300 58 320 66 
                         Q 325 78 318 88 
                         Q 280 96 210 92 
                         Q 140 88 70 92 
                         Q 25 94 8 78 Z"
                      fill="none" stroke="url(#finGrad)" stroke-width="1.6" opacity="0.35"/>

                <!-- ХВОСТОВОЙ ПЛАВНИК (за буквой A, справа) -->
                <g class="tail-anim">
                    <!-- Верхняя лопасть хвоста -->
                    <path d="M 305 62 Q 330 30 340 14 Q 328 48 328 66 Z" fill="url(#tailGrad)"/>
                    <!-- Нижняя лопасть хвоста -->
                    <path d="M 305 78 Q 330 100 340 118 Q 328 92 328 74 Z" fill="url(#tailGrad)"/>
                </g>

                <!-- БУКВА F — превращена в СПИННОЙ ПЛАВНИК (торчит вверх) -->
                <g class="fin-anim">
                    <!-- Плавник-треугольник -->
                    <path d="M 58 62 Q 78 8 96 58 L 74 58 Z" 
                          fill="url(#finGrad)" filter="url(#softGlow)"/>
                    <!-- Буква F стилизована внутри плавника (горизонтальные штрихи как часть плавника) -->
                    <text x="60" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900"
                          fill="url(#bodyGrad)" filter="url(#softGlow)">F</text>
                </g>

                <!-- ГЛАЗ АКУЛЫ (между F и i) -->
                <circle cx="104" cy="66" r="3.4" fill="#ff453a" class="eye-blink"/>
                <circle cx="104" cy="66" r="1.5" fill="#fff"/>

                <!-- БУКВЫ ТЕЛА: i S H K -->
                <text x="112" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900"
                      fill="url(#bodyGrad)" filter="url(#softGlow)">i</text>
                <text x="128" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900"
                      fill="url(#bodyGrad)" filter="url(#softGlow)">S</text>
                <text x="172" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900"
                      fill="url(#bodyGrad)" filter="url(#softGlow)">H</text>
                <text x="216" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900"
                      fill="url(#bodyGrad)" filter="url(#softGlow)">K</text>

                <!-- БУКВА A — как верхний плавник-хвост акулы, соединена с телом -->
                <text x="258" y="82" font-family="'Arial Black', Impact, sans-serif" font-size="42" font-weight="900"
                      fill="url(#bodyGrad)" filter="url(#softGlow)">A</text>

                <!-- БОКОВОЙ ПЛАВНИК (снизу под буквами S-H) -->
                <path d="M 150 84 Q 165 108 190 100 Q 175 92 168 84 Z" 
                      fill="url(#finGrad)" opacity="0.9"/>

                <!-- ЖАБРЫ (три линии за буквой K, перед хвостом) -->
                <path d="M 244 64 Q 248 74 244 84" stroke="#ff9f0a" stroke-width="1.3" fill="none" opacity="0.55"/>
                <path d="M 250 62 Q 254 74 250 86" stroke="#ff9f0a" stroke-width="1.3" fill="none" opacity="0.45"/>
                <path d="M 256 62 Q 260 74 256 86" stroke="#ff9f0a" stroke-width="1.3" fill="none" opacity="0.35"/>

                <!-- ПУЗЫРЬКИ -->
                <circle cx="30" cy="40" r="2.6" fill="#ff9f0a" class="bub" opacity="0.75"/>
                <circle cx="18" cy="24" r="1.9" fill="#ff9f0a" class="bub" opacity="0.5"/>
                <circle cx="44" cy="30" r="1.5" fill="#ff9f0a" class="bub" opacity="0.6"/>

                <!-- ЛИНИЯ ВОДЫ (подчёркивание под акулой) -->
                <path d="M 5 108 Q 80 100 160 104 Q 250 108 335 100" 
                      stroke="#ff9f0a" stroke-width="1.8" fill="none" opacity="0.5" stroke-linecap="round"/>
            </svg>
        </div>
        <!-- ====== КОНЕЦ ЛОГОТИПА ====== -->

        <div class="table-badge" id="tableBadge">Столик №1</div>
    </header>

    <nav class="categories-scroll" id="categoriesNav"></nav>

    <main class="menu-container" id="menuContainer"></main>

    <div class="cart-bar" id="cartBar" style="display: none;" onclick="sendOrderToWhatsApp()">
        <div>
            <span id="cartCount">0</span> позиций
        </div>
        <div>Отправить заказ в WhatsApp ➔</div>
        <div id="cartTotal">0 ₽</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px;">Панель Управления</h2>
            
            <div id="authBlock">
                <p>Введите пароль администратора:</p>
                <input type="password" id="adminPassword" class="input-field" placeholder="Пароль">
                <button class="btn-action" onclick="checkAdminPassword()">Войти</button>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Закрыть</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button class="btn-action" onclick="showAdminTab('editor')">Редактор Меню</button>
                    <button class="btn-action" onclick="showAdminTab('qr')">QR-коды (40 столов)</button>
                </div>

                <div id="tabEditor">
                    <h3>Добавить / Изменить блюдо</h3>
                    <input type="hidden" id="editIndex">
                    <input type="text" id="editName" class="input-field" placeholder="Название блюда">
                    <input type="number" id="editPrice" class="input-field" placeholder="Цена (руб)">
                    <input type="text" id="editTime" class="input-field" placeholder="Время готовки (~15 мин)">
                    <select id="editCategory" class="input-field"></select>
                    <p style="font-size: 12px; color: var(--text-sub);">Загрузить фото из памяти устройства:</p>
                    <input type="file" id="editImageFile" accept="image/*" class="input-field">
                    
                    <button class="btn-action" onclick="saveFoodItem()">Сохранить позицию</button>
                    <button class="btn-action btn-close" onclick="resetEditForm()">Очистить форму</button>
                    <hr style="border-color: var(--border-color); margin: 16px 0;">
                    
                    <h3>Текущее меню</h3>
                    <div id="adminFoodList" style="margin-top: 10px;"></div>
                </div>

                <div id="tabQR" style="display: none;">
                    <h3>QR-коды для 40 столиков</h3>
                    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">Распечатайте и наклейте на соответствующие столики:</p>
                    <div class="qr-grid" id="qrGrid"></div>
                </div>

                <br>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Выйти из админки</button>
            </div>
        </div>
    </div>

    <script>
        const PHONE_NUMBER = "79681755402";
        
        const initialMenu = [
            { name: "Горячий шик", price: 300, time: "~15-20 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" },
            { name: "Филадельфия", price: 300, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500" },
            { name: "Гамбургер куриный", price: 130, time: "~10 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { name: "Хот-дог", price: 120, time: "~7 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500" },
            { name: "Шаурма", price: 200, time: "~10 мин", cat: "Восточная кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500" },
            { name: "Цезарь с курицей", price: 300, time: "~12 мин", cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" },
            { name: "Американо", price: 150, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" }
        ];

        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let activeCategory = "Все";
        let currentTable = 1;

        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                currentTable = tableParam;
            }
            document.getElementById('tableBadge').innerText = `Столик №${currentTable}`;
        }

        function renderCategories() {
            const categories = ["Все", ...new Set(menuData.map(item => item.cat))];
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            const editCatSelect = document.getElementById('editCategory');
            editCatSelect.innerHTML = categories.filter(c => c !== "Все").map(c => `<option value="${c}">${c}</option>`).join('');
            editCatSelect.innerHTML += `<option value="Новая">+ Добавить новую категорию</option>`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const filtered = activeCategory === "Все" ? menuData : menuData.filter(i => i.cat === activeCategory);

            container.innerHTML = filtered.map((item) => {
                const globalIndex = menuData.indexOf(item);
                const qty = cart[globalIndex] || 0;

                return `
                <div class="food-card">
                    <img src="${item.img}" class="food-img" alt="${item.name}">
                    <div class="food-info">
                        <div class="food-name">${item.name}</div>
                        <div class="food-meta">
                            <span>⏱ ${item.time || '~15 мин'}</span>
                            <span>Категория: ${item.cat}</span>
                        </div>
                        <div class="food-bottom">
                            <div class="food-price">${item.price} ₽</div>
                            ${qty > 0 ? `
                                <div class="counter-controls">
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, -1)">-</button>
                                    <span class="qty-val">${qty}</span>
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, 1)">+</button>
                                </div>
                            ` : `
                                <button class="btn-add" onclick="updateQty(${globalIndex}, 1)">Добавить</button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function updateQty(index, delta) {
            cart[index] = (cart[index] || 0) + delta;
            if (cart[index] <= 0) delete cart[index];
            renderMenu();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;

            for (let idx in cart) {
                totalCount += cart[idx];
                totalPrice += cart[idx] * menuData[idx].price;
            }

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function sendOrderToWhatsApp() {
            let orderText = `📍 *ЗАКАЗ — СТОЛИК №${currentTable}*\n\n`;
            let totalPrice = 0;

            for (let idx in cart) {
                const item = menuData[idx];
                const itemTotal = item.price * cart[idx];
                totalPrice += itemTotal;
                orderText += `• ${item.name} x${cart[idx]} = ${itemTotal} ₽\n`;
            }

            orderText += `\n💰 *Итого к оплате:* ${totalPrice} ₽`;

            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "54321") {
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminFoodList();
                generateQRCodes();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showAdminTab(tab) {
            document.getElementById('tabEditor').style.display = tab === 'editor' ? 'block' : 'none';
            document.getElementById('tabQR').style.display = tab === 'qr' ? 'block' : 'none';
        }

        function saveFoodItem() {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value);
            const time = document.getElementById('editTime').value;
            let cat = document.getElementById('editCategory').value;
            const fileInput = document.getElementById('editImageFile');
            const editIndex = document.getElementById('editIndex').value;

            if (cat === "Новая") {
                cat = prompt("Введите название новой категории:");
                if (!cat) return;
            }

            if (!name || !price) {
                alert("Заполните имя и цену!");
                return;
            }

            const processSave = (imgUrl) => {
                const itemObj = {
                    name, price, time: time || "~15 мин", cat,
                    img: imgUrl || (editIndex !== "" ? menuData[editIndex].img : "https://via.placeholder.com/300")
                };

                if (editIndex !== "") {
                    menuData[editIndex] = itemObj;
                } else {
                    menuData.push(itemObj);
                }

                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                resetEditForm();
                renderCategories();
                renderMenu();
                renderAdminFoodList();
                alert("Сохранено!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processSave(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSave(null);
            }
        }

        function renderAdminFoodList() {
            const container = document.getElementById('adminFoodList');
            container.innerHTML = menuData.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:8px; margin-bottom:6px; border-radius:8px;">
                    <div><strong>${item.name}</strong> (${item.price} ₽)</div>
                    <div>
                        <button style="padding:4px 8px;" onclick="editFoodItem(${idx})">✏️</button>
                        <button style="padding:4px 8px; background:var(--danger-color); color:#fff; border:none; border-radius:4px;" onclick="deleteFoodItem(${idx})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function editFoodItem(idx) {
            const item = menuData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editTime').value = item.time;
            document.getElementById('editCategory').value = item.cat;
        }

        function deleteFoodItem(idx) {
            if (confirm("Удалить это блюдо?")) {
                menuData.splice(idx, 1);
                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                renderCategories();
                renderMenu();
                renderAdminFoodList();
            }
        }

        function resetEditForm() {
            document.getElementById('editIndex').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editPrice').value = "";
            document.getElementById('editTime').value = "";
            document.getElementById('editImageFile').value = "";
        }

        function generateQRCodes() {
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `<div id="qr_${i}"></div><strong style="margin-top:4px; display:block;">Стол №${i}</strong>`;
                grid.appendChild(card);

                new QRCode(document.getElementById(`qr_${i}`), {
                    text: `${baseUrl}?table=${i}`,
                    width: 100,
                    height: 100
                });
            }
        }

        initTableNumber();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
