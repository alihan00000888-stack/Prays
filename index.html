<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKA — Меню и Заказ</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff9f0a;
            --text-main: #f2f2f7;
            --text-sub: #a1a1a6;
            --border-color: #2c2c30;
            --danger-color: #ff453a;
            --success-color: #30d158;
            --shark-green: #6ee06e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* HEADER */
        header {
            background: linear-gradient(180deg, #1c1c1e 0%, var(--bg-color) 100%);
            padding: 18px 16px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        /* ===== ЛОГОТИП-АКУЛА (как на фото) ===== */
        .logo-wrap {
            display: inline-block;
            margin-bottom: 6px;
        }
        .logo-svg {
            width: 240px;
            height: 240px;
            display: block;
            filter: drop-shadow(0 6px 18px rgba(110, 224, 110, 0.25));
        }
        /* лёгкое покачивание всей акулы */
        .shark-body {
            animation: sharkSwim 4s ease-in-out infinite;
            transform-origin: 50% 50%;
        }
        @keyframes sharkSwim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-3px) rotate(-1.5deg); }
        }
        /* хвост виляет */
        .shark-tail {
            animation: tailWag 2s ease-in-out infinite;
            transform-origin: 190px 150px;
        }
        @keyframes tailWag {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(6deg); }
        }
        /* плавник-спинка */
        .shark-fin {
            animation: finBob 3s ease-in-out infinite;
            transform-origin: 150px 110px;
        }
        @keyframes finBob {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-2px); }
        }
        /* глаз */
        .shark-eye {
            animation: blinkEye 5s infinite;
        }
        @keyframes blinkEye {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }
        /* пузырьки */
        .bubble { animation: bubbleUp 4s ease-in infinite; }
        .bubble:nth-child(2) { animation-delay: 1.3s; }
        .bubble:nth-child(3) { animation-delay: 2.6s; }
        @keyframes bubbleUp {
            0% { opacity: 0; transform: translate(0, 0) scale(0.6); }
            20% { opacity: 0.9; }
            100% { opacity: 0; transform: translate(-6px, -34px) scale(1.1); }
        }

        .table-badge {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* CATEGORIES NAV */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background-color: var(--bg-color);
            scrollbar-width: none;
            position: sticky;
            top: 0;
            z-index: 90;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* MENU LIST & CARDS */
        .menu-container {
            padding: 8px 16px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Заголовок категории-разделителя */
        .category-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 22px 0 12px;
            padding: 0 2px;
        }
        .category-header::before {
            content: "";
            width: 4px;
            height: 22px;
            background: var(--accent-color);
            border-radius: 2px;
            display: inline-block;
        }
        .category-header::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border-color), transparent);
            margin-left: 6px;
        }
        .category-title {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .food-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2c2c2e;
        }

        .food-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .food-name {
            font-size: 17px;
            font-weight: 700;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* COUNTER CONTROLS */
        .counter-controls {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-val {
            padding: 0 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* CART FLOATING BAR */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background-color: var(--accent-color);
            color: #000;
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(255, 159, 10, 0.3);
            z-index: 99;
            cursor: pointer;
            font-weight: 800;
        }

        /* ADMIN & MODAL STYLES */
        .admin-trigger {
            position: fixed;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            opacity: 0.2;
            font-size: 18px;
            color: #fff;
            z-index: 101;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-field, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-close { background: #3a3a3c; color: #fff; }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-card div { margin: 0 auto; }
    </style>
</head>
<body>

    <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>

    <header>
        <!-- ====== ЛОГОТИП-АКУЛА (в круге, как на фото) ====== -->
        <div class="logo-wrap">
            <svg class="logo-svg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg" aria-label="FiSHKA — логотип-акула">
                <defs>
                    <clipPath id="circleClip">
                        <circle cx="130" cy="130" r="118"/>
                    </clipPath>
                </defs>

                <!-- Белый круг -->
                <circle cx="130" cy="130" r="125" fill="#ffffff"/>
                <!-- Зелёная обводка -->
                <circle cx="130" cy="130" r="120" fill="none" stroke="#6ee06e" stroke-width="9"/>

                <!-- ===== АКУЛА (тело из букв) ===== -->
                <g clip-path="url(#circleClip)">
                    <g class="shark-body">
                        <!-- ХВОСТ (слева, острый треугольник) -->
                        <g class="shark-tail">
                            <path d="M 60 128 
                                     L 22 108 
                                     Q 40 128 22 150 
                                     L 60 132 Z" 
                                  fill="#000000"/>
                            <!-- внутренняя линия хвоста -->
                            <path d="M 55 128 L 30 118 Q 42 128 30 140 L 55 130 Z" 
                                  fill="#ffffff" opacity="0.15"/>
                        </g>

                        <!-- СПИННОЙ ПЛАВНИК (над головой) -->
                        <g class="shark-fin">
                            <path d="M 175 90 
                                     Q 190 62 210 78 
                                     Q 200 88 195 100 Z" 
                                  fill="#000000"/>
                        </g>

                        <!-- ТЕЛО + НАДПИСЬ FiSHKA (стилизованная акула) -->
                        <!-- Буква F (с наклоном, как голова акулы) -->
                        <text x="72" y="160" 
                              font-family="'Arial Black', 'Impact', sans-serif" 
                              font-size="72" font-weight="900" 
                              fill="#000000" 
                              transform="rotate(-8 90 140)"
                              style="letter-spacing:-4px;">F</text>

                        <!-- Буква i с точкой -->
                        <circle cx="128" cy="98" r="6" fill="#000000"/>
                        <text x="118" y="160" 
                              font-family="'Arial Black', 'Impact', sans-serif" 
                              font-size="72" font-weight="900" 
                              fill="#000000"
                              style="letter-spacing:-4px;">i</text>

                        <!-- Буква S -->
                        <text x="138" y="160" 
                              font-family="'Arial Black', 'Impact', sans-serif" 
                              font-size="72" font-weight="900" 
                              fill="#000000"
                              style="letter-spacing:-4px;">S</text>

                        <!-- Буква H -->
                        <text x="182" y="160" 
                              font-family="'Arial Black', 'Impact', sans-serif" 
                              font-size="72" font-weight="900" 
                              fill="#000000"
                              style="letter-spacing:-4px;">H</text>

                        <!-- Буква K -->
                        <text x="225" y="160" 
                              font-family="'Arial Black', 'Impact', sans-serif" 
                              font-size="72" font-weight="900" 
                              fill="#000000"
                              style="letter-spacing:-4px;">K</text>

                        <!-- Буква A с хвостиком-плавником -->
                        <text x="268" y="160" 
                              font-family="'Arial Black', 'Impact', sans-serif" 
                              font-size="72" font-weight="900" 
                              fill="#000000"
                              style="letter-spacing:-4px;">A</text>

                        <!-- Хвостик буквы A (нижний плавник) -->
                        <path d="M 300 158 Q 320 175 315 190 Q 305 178 295 168 Z" 
                              fill="#000000"/>

                        <!-- ГЛАЗ (между F и i) -->
                        <g class="shark-eye">
                            <circle cx="112" cy="128" r="5" fill="#ffffff"/>
                            <circle cx="113" cy="128" r="2.5" fill="#000000"/>
                        </g>

                        <!-- Жабры (3 линии справа) -->
                        <path d="M 322 118 Q 326 130 322 142" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 332 120 Q 336 130 332 140" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
                        <path d="M 342 122 Q 345 130 342 138" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>

                        <!-- ПУЗЫРЬКИ -->
                        <circle cx="90" cy="88" r="4" fill="#000000" class="bubble" opacity="0.85"/>
                        <circle cx="78" cy="72" r="3" fill="#000000" class="bubble" opacity="0.7"/>
                        <circle cx="102" cy="60" r="2.5" fill="#000000" class="bubble" opacity="0.6"/>
                    </g>
                </g>
            </svg>
        </div>
        <!-- ====== КОНЕЦ ЛОГОТИПА ====== -->

        <div class="table-badge" id="tableBadge">Столик №1</div>
    </header>

    <nav class="categories-scroll" id="categoriesNav">
        <!-- Категории будут сгенерированы автоматически -->
    </nav>

    <main class="menu-container" id="menuContainer">
        <!-- Меню будет сгенерировано динамически с разделителями -->
    </main>

    <div class="cart-bar" id="cartBar" style="display: none;" onclick="sendOrderToWhatsApp()">
        <div>
            <span id="cartCount">0</span> позиций
        </div>
        <div>Отправить заказ в WhatsApp ➔</div>
        <div id="cartTotal">0 ₽</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px;">Панель Управления</h2>
            
            <div id="authBlock">
                <p>Введите пароль администратора:</p>
                <input type="password" id="adminPassword" class="input-field" placeholder="Пароль">
                <button class="btn-action" onclick="checkAdminPassword()">Войти</button>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Закрыть</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button class="btn-action" onclick="showAdminTab('editor')">Редактор Меню</button>
                    <button class="btn-action" onclick="showAdminTab('qr')">QR-коды (40 столов)</button>
                </div>

                <div id="tabEditor">
                    <h3>Добавить / Изменить блюдо</h3>
                    <input type="hidden" id="editIndex">
                    <input type="text" id="editName" class="input-field" placeholder="Название блюда">
                    <input type="number" id="editPrice" class="input-field" placeholder="Цена (руб)">
                    <input type="text" id="editTime" class="input-field" placeholder="Время готовки (~15 мин)">
                    <select id="editCategory" class="input-field">
                    </select>
                    <p style="font-size: 12px; color: var(--text-sub);">Загрузить фото из памяти устройства:</p>
                    <input type="file" id="editImageFile" accept="image/*" class="input-field">
                    
                    <button class="btn-action" onclick="saveFoodItem()">Сохранить позицию</button>
                    <button class="btn-action btn-close" onclick="resetEditForm()">Очистить форму</button>
                    <hr style="border-color: var(--border-color); margin: 16px 0;">
                    
                    <h3>Текущее меню</h3>
                    <div id="adminFoodList" style="margin-top: 10px;"></div>
                </div>

                <div id="tabQR" style="display: none;">
                    <h3>QR-коды для 40 столиков</h3>
                    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">Распечатайте и наклейте на соответствующие столики:</p>
                    <div class="qr-grid" id="qrGrid"></div>
                </div>

                <br>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Выйти из админки</button>
            </div>
        </div>
    </div>

    <script>
        const PHONE_NUMBER = "79681755402";
        
        const initialMenu = [
            { name: "Горячий шик", price: 300, time: "~15-20 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" },
            { name: "Филадельфия", price: 300, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500" },
            { name: "Калифорния", price: 280, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1553621042-f6e147245754?w=500" },
            { name: "Гамбургер куриный", price: 130, time: "~10 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { name: "Хот-дог", price: 120, time: "~7 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500" },
            { name: "Картофель фри", price: 90, time: "~8 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500" },
            { name: "Пицца Пепперони", price: 450, time: "~20 мин", cat: "Пицца", img: "https://images.unsplash.com/photo-1628840042765-356cda07504e?w=500" },
            { name: "Пицца Маргарита", price: 400, time: "~18 мин", cat: "Пицца", img: "https://images.unsplash.com/photo-1574071318508-1cdbab80d002?w=500" },
            { name: "Шаурма", price: 200, time: "~10 мин", cat: "Восточная кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500" },
            { name: "Цезарь с курицей", price: 300, time: "~12 мин", cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" },
            { name: "Американо", price: 150, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" },
            { name: "Капучино", price: 180, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1572442388796-11668a67e53d?w=500" }
        ];

        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let activeCategory = "Все";
        let currentTable = 1;

        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) currentTable = tableParam;
            document.getElementById('tableBadge').innerText = `Столик №${currentTable}`;
        }

        // Возвращает список категорий в порядке появления в меню (без "Все")
        function getOrderedCategories() {
            const seen = new Set();
            const ordered = [];
            menuData.forEach(item => {
                if (!seen.has(item.cat)) {
                    seen.add(item.cat);
                    ordered.push(item.cat);
                }
            });
            return ordered;
        }

        function renderCategories() {
            const categories = ["Все", ...getOrderedCategories()];
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            const editCatSelect = document.getElementById('editCategory');
            editCatSelect.innerHTML = getOrderedCategories().map(c => `<option value="${c}">${c}</option>`).join('');
            editCatSelect.innerHTML += `<option value="Новая">+ Добавить новую категорию</option>`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        // Рендер меню с заголовками-разделителями категорий
        function renderMenu() {
            const container = document.getElementById('menuContainer');
            let html = '';

            if (activeCategory === "Все") {
                // Показываем все категории по порядку с заголовками
                const cats = getOrderedCategories();
                cats.forEach(cat => {
                    const items = menuData.filter(i => i.cat === cat);
                    if (items.length === 0) return;

                    html += `<div class="category-header"><span class="category-title">${cat}</span></div>`;
                    items.forEach(item => {
                        html += renderFoodCard(item, menuData.indexOf(item));
                    });
                });
            } else {
                // Показываем только выбранную категорию (с заголовком)
                const items = menuData.filter(i => i.cat === activeCategory);
                if (items.length > 0) {
                    html += `<div class="category-header"><span class="category-title">${activeCategory}</span></div>`;
                    items.forEach(item => {
                        html += renderFoodCard(item, menuData.indexOf(item));
                    });
                }
            }

            container.innerHTML = html;
        }

        function renderFoodCard(item, globalIndex) {
            const qty = cart[globalIndex] || 0;
            return `
            <div class="food-card">
                <img src="${item.img}" class="food-img" alt="${item.name}">
                <div class="food-info">
                    <div class="food-name">${item.name}</div>
                    <div class="food-meta">
                        <span>⏱ ${item.time || '~15 мин'}</span>
                        <span>${item.cat}</span>
                    </div>
                    <div class="food-bottom">
                        <div class="food-price">${item.price} ₽</div>
                        ${qty > 0 ? `
                            <div class="counter-controls">
                                <button class="btn-qty" onclick="updateQty(${globalIndex}, -1)">-</button>
                                <span class="qty-val">${qty}</span>
                                <button class="btn-qty" onclick="updateQty(${globalIndex}, 1)">+</button>
                            </div>
                        ` : `
                            <button class="btn-add" onclick="updateQty(${globalIndex}, 1)">Добавить</button>
                        `}
                    </div>
                </div>
            </div>`;
        }

        function updateQty(index, delta) {
            cart[index] = (cart[index] || 0) + delta;
            if (cart[index] <= 0) delete cart[index];
            renderMenu();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;

            for (let idx in cart) {
                totalCount += cart[idx];
                totalPrice += cart[idx] * menuData[idx].price;
            }

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        function sendOrderToWhatsApp() {
            let orderText = `📍 *ЗАКАЗ — СТОЛИК №${currentTable}*\n\n`;
            let totalPrice = 0;

            for (let idx in cart) {
                const item = menuData[idx];
                const itemTotal = item.price * cart[idx];
                totalPrice += itemTotal;
                orderText += `• ${item.name} x${cart[idx]} = ${itemTotal} ₽\n`;
            }

            orderText += `\n💰 *Итого к оплате:* ${totalPrice} ₽`;
            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
        }

        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "54321") {
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminFoodList();
                generateQRCodes();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showAdminTab(tab) {
            document.getElementById('tabEditor').style.display = tab === 'editor' ? 'block' : 'none';
            document.getElementById('tabQR').style.display = tab === 'qr' ? 'block' : 'none';
        }

        function saveFoodItem() {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value);
            const time = document.getElementById('editTime').value;
            let cat = document.getElementById('editCategory').value;
            const fileInput = document.getElementById('editImageFile');
            const editIndex = document.getElementById('editIndex').value;

            if (cat === "Новая") {
                cat = prompt("Введите название новой категории:");
                if (!cat) return;
            }

            if (!name || !price) {
                alert("Заполните имя и цену!");
                return;
            }

            const processSave = (imgUrl) => {
                const itemObj = {
                    name, price, time: time || "~15 мин", cat,
                    img: imgUrl || (editIndex !== "" ? menuData[editIndex].img : "https://via.placeholder.com/300")
                };

                if (editIndex !== "") {
                    menuData[editIndex] = itemObj;
                } else {
                    menuData.push(itemObj);
                }

                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                resetEditForm();
                renderCategories();
                renderMenu();
                renderAdminFoodList();
                alert("Сохранено!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processSave(e.target.result);
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSave(null);
            }
        }

        function renderAdminFoodList() {
            const container = document.getElementById('adminFoodList');
            container.innerHTML = menuData.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:8px; margin-bottom:6px; border-radius:8px;">
                    <div><strong>${item.name}</strong> (${item.price} ₽) — <span style="color:var(--text-sub); font-size:12px;">${item.cat}</span></div>
                    <div>
                        <button style="padding:4px 8px;" onclick="editFoodItem(${idx})">✏️</button>
                        <button style="padding:4px 8px; background:var(--danger-color); color:#fff; border:none; border-radius:4px;" onclick="deleteFoodItem(${idx})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function editFoodItem(idx) {
            const item = menuData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editTime').value = item.time;
            document.getElementById('editCategory').value = item.cat;
        }

        function deleteFoodItem(idx) {
            if (confirm("Удалить это блюдо?")) {
                menuData.splice(idx, 1);
                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                renderCategories();
                renderMenu();
                renderAdminFoodList();
            }
        }

        function resetEditForm() {
            document.getElementById('editIndex').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editPrice').value = "";
            document.getElementById('editTime').value = "";
            document.getElementById('editImageFile').value = "";
        }

        function generateQRCodes() {
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `<div id="qr_${i}"></div><strong style="margin-top:4px; display:block;">Стол №${i}</strong>`;
                grid.appendChild(card);

                new QRCode(document.getElementById(`qr_${i}`), {
                    text: `${baseUrl}?table=${i}`,
                    width: 100,
                    height: 100
                });
            }
        }

        // СТАРТ
        initTableNumber();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
