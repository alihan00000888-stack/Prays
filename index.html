<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKa — Интерактивное меню</title>
    <!-- Подключение библиотеки QR-кодов -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff9f43;
            --accent-hover: #ee5253;
            --text-main: #f5f6fa;
            --text-muted: #a4b0be;
            --border-color: #2f3542;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 110px;
        }

        /* Шапка */
        header {
            background-color: #09090a;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-text {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            color: var(--accent-color);
            text-transform: uppercase;
        }

        .table-badge {
            background-color: var(--border-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        /* Категории */
        .categories-nav {
            display: flex;
            overflow-x: auto;
            padding: 12px 15px;
            gap: 10px;
            background: #18181c;
            border-bottom: 1px solid var(--border-color);
            scrollbar-width: none;
        }
        .categories-nav::-webkit-scrollbar { display: none; }

        .cat-btn {
            background: var(--card-bg);
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border-color: var(--accent-color);
        }

        /* Каталог блюд */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 15px;
        }

        .section-title {
            font-size: 20px;
            margin: 20px 0 12px 0;
            color: var(--accent-color);
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        .food-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            display: flex;
            gap: 12px;
            align-items: center;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .food-img {
            width: 85px;
            height: 85px;
            border-radius: 10px;
            object-fit: cover;
            background: #2a2a30;
            flex-shrink: 0;
        }

        .food-info {
            flex-grow: 1;
        }

        .food-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .food-meta {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .food-price {
            font-size: 16px;
            font-weight: 700;
            color: var(--accent-color);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .btn-qty {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: none;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qty-val {
            font-weight: bold;
            min-width: 18px;
            text-align: center;
            font-size: 14px;
        }

        /* Корзина снизу */
        .cart-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #18181c;
            border-top: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
            z-index: 99;
        }

        .cart-total {
            display: flex;
            flex-direction: column;
        }

        .cart-total-price {
            font-size: 20px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .cart-total-time {
            font-size: 12px;
            color: var(--text-muted);
        }

        .btn-send {
            background: #25D366;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-send:disabled {
            background: var(--border-color);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        /* Кнопка Админки */
        .admin-trigger {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            padding: 20px;
            overflow-y: auto;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 20px;
            max-width: 500px;
            margin: 30px auto;
            border: 1px solid var(--border-color);
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 15px; right: 15px;
            background: none; border: none;
            color: var(--text-muted);
            font-size: 22px; cursor: pointer;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .input-field {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-main);
            font-size: 14px;
        }

        .btn-primary {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Сетка QR кодов */
        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .qr-card div {
            margin: 0 auto 5px auto;
        }

        .qr-card span {
            font-weight: bold;
            font-size: 14px;
        }

        @media print {
            body * { visibility: hidden; }
            #qrPrintSection, #qrPrintSection * { visibility: visible; }
            #qrPrintSection { position: absolute; left: 0; top: 0; width: 100%; }
            .qr-card { page-break-inside: avoid; margin-bottom: 20px; }
        }
    </style>
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo-container">
            <div class="logo-text">FiSHKa</div>
            <div class="table-badge" id="tableDisplay">Стол: Не выбран</div>
        </div>
        <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>
    </header>

    <!-- Навигация по категориям -->
    <div class="categories-nav" id="categoriesNav"></div>

    <!-- Основной контент -->
    <div class="container" id="menuContainer"></div>

    <!-- Нижняя плашка корзины -->
    <div class="cart-bar">
        <div class="cart-total">
            <div class="cart-total-price" id="totalPrice">0 ₽</div>
            <div class="cart-total-time" id="totalTime">Время ожидания: ~0 мин</div>
        </div>
        <button class="btn-send" id="sendOrderBtn" onclick="sendOrderToWhatsApp()" disabled>
            Заказать в WhatsApp
        </button>
    </div>

    <!-- Модальное окно Входа в Админку -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('loginModal')">✕</button>
            <h3 style="margin-bottom:15px;">Вход для администратора</h3>
            <div class="input-group">
                <label>Введите пароль</label>
                <input type="password" id="adminPasswordInput" class="input-field" placeholder="Пароль">
            </div>
            <button class="btn-primary" onclick="checkAdminPassword()">Войти</button>
        </div>
    </div>

    <!-- Панель Администратора -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
            <h2 style="margin-bottom:15px; color: var(--accent-color);">Управление меню</h2>

            <!-- Форма добавления/редактирования -->
            <div style="border-bottom: 1px solid var(--border-color); padding-bottom:15px; margin-bottom:15px;">
                <h4 style="margin-bottom:10px;">Добавить / Изменить блюдо</h4>
                <input type="hidden" id="editItemId">
                <div class="input-group">
                    <label>Категория</label>
                    <select id="itemCat" class="input-field">
                        <option value="Роллы">Роллы</option>
                        <option value="Фаст-Фуд">Фаст-Фуд</option>
                        <option value="Восточная Кухня">Восточная Кухня</option>
                        <option value="Салаты">Салаты</option>
                        <option value="Пиццы">Пиццы</option>
                        <option value="Напитки">Напитки</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Название</label>
                    <input type="text" id="itemName" class="input-field">
                </div>
                <div class="input-group">
                    <label>Цена (₽)</label>
                    <input type="number" id="itemPrice" class="input-field">
                </div>
                <div class="input-group">
                    <label>Время приготовления (мин)</label>
                    <input type="number" id="itemPrepTime" class="input-field" value="15">
                </div>
                <div class="input-group">
                    <label>Ссылка на фото (URL)</label>
                    <input type="text" id="itemImg" class="input-field">
                </div>
                <button class="btn-primary" onclick="saveMenuItem()">Сохранить позицию</button>
            </div>

            <!-- Генерирование QR-кодов -->
            <div>
                <h4 style="margin-bottom:10px;">Печать QR-кодов столиков (40 столов)</h4>
                <button class="btn-primary" style="background:#3742fa; color:#fff;" onclick="generateQRCodes()">Сгенерировать 40 QR-кодов</button>
                <div id="qrPrintSection" class="qr-grid"></div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация базы данных блюд
        const initialMenu = [
            // Роллы
            { id: 1, name: "Горячий шик", price: 300, prepTime: 20, cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=300" },
            { id: 2, name: "Бешеный лосось", price: 300, prepTime: 20, cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=300" },
            { id: 3, name: "Калифорния краб", price: 250, prepTime: 15, cat: "Роллы", img: "https://images.unsplash.com/photo-1553621042-f6e147245754?w=300" },
            { id: 4, name: "Филадельфия", price: 300, prepTime: 15, cat: "Роллы", img: "https://images.unsplash.com/photo-1617196034796-73dfa7b1fd56?w=300" },
            { id: 5, name: "Американо", price: 300, prepTime: 15, cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=300" },

            // Фаст-фуд
            { id: 6, name: "Гамбургер куриный", price: 130, prepTime: 10, cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=300" },
            { id: 7, name: "Чизбургер говяжий", price: 150, prepTime: 12, cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=300" },
            { id: 8, name: "Бургер Fishka", price: 200, prepTime: 15, cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=300" },
            { id: 9, name: "Хот-дог", price: 120, prepTime: 8, cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=300" },
            { id: 10, name: "Картошка фри", price: 130, prepTime: 8, cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300" },

            // Восточная кухня
            { id: 11, name: "Шаурма", price: 200, prepTime: 10, cat: "Восточная Кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=300" },
            { id: 12, name: "Шашлык", price: 430, prepTime: 25, cat: "Восточная Кухня", img: "https://images.unsplash.com/photo-1555939594-58d7cb561ad1?w=300" },
            { id: 13, name: "Люля кебаб", price: 380, prepTime: 20, cat: "Восточная Кухня", img: "https://images.unsplash.com/photo-1603360946369-dc9bb6258143?w=300" },

            // Салаты
            { id: 14, name: "Цезарь с курицей", price: 300, prepTime: 12, cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=300" },
            { id: 15, name: "Греческий", price: 300, prepTime: 10, cat: "Салаты", img: "https://images.unsplash.com/photo-1540420773420-3366772f4999?w=300" },

            // Пиццы
            { id: 16, name: "Пицца Грибная", price: 350, prepTime: 20, cat: "Пиццы", img: "https://images.unsplash.com/photo-1513104890138-7c749659a591?w=300" },
            { id: 17, name: "Хачапури с сыром", price: 300, prepTime: 18, cat: "Пиццы", img: "https://images.unsplash.com/photo-1608039829572-78524f79c4c7?w=300" },

            // Напитки
            { id: 18, name: "Капучино", price: 200, prepTime: 5, cat: "Напитки", img: "https://images.unsplash.com/photo-1534778101976-62847782c213?w=300" },
            { id: 19, name: "Лимонад Клубничный", price: 180, prepTime: 5, cat: "Напитки", img: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300" }
        ];

        // Загрузка меню из LocalStorage
        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let currentTable = "1";
        let targetPhoneNumber = "79681755402";

        // Определяем столик из URL
        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                currentTable = tableParam;
            }
            document.getElementById('tableDisplay').innerText = `Стол: №${currentTable}`;
        }

        // Отрисовка навигации по категориям
        function renderCategories() {
            const categories = [...new Set(menuData.map(item => item.cat))];
            const container = document.getElementById('categoriesNav');
            container.innerHTML = categories.map((cat, idx) => `
                <button class="cat-btn ${idx === 0 ? 'active' : ''}" onclick="filterCategory('${cat}', this)">${cat}</button>
            `).join('');
            renderMenu(categories[0]);
        }

        // Отрисовка блюд выбранной категории
        function filterCategory(cat, btn) {
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if(btn) btn.classList.add('active');
            renderMenu(cat);
        }

        function renderMenu(category) {
            const container = document.getElementById('menuContainer');
            const items = menuData.filter(i => i.cat === category);

            container.innerHTML = `
                <div class="section-title">${category}</div>
                <div class="food-grid">
                    ${items.map(item => `
                        <div class="food-card">
                            <img src="${item.img}" class="food-img" alt="${item.name}" onerror="this.src='https://via.placeholder.com/100?text=FiSHKa'">
                            <div class="food-info">
                                <div class="food-title">${item.name}</div>
                                <div class="food-meta">⌛ ~${item.prepTime} мин</div>
                                <div class="food-price">${item.price} ₽</div>
                            </div>
                            <div class="controls">
                                <button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button>
                                <span class="qty-val" id="qty-${item.id}">${cart[item.id] || 0}</span>
                                <button class="btn-qty" onclick="updateQty(${item.id}, 1)">+</button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Обновление количества порций
        function updateQty(itemId, change) {
            const current = cart[itemId] || 0;
            const updated = Math.max(0, current + change);

            if (updated === 0) {
                delete cart[itemId];
            } else {
                cart[itemId] = updated;
            }

            const qtyEl = document.getElementById(`qty-${itemId}`);
            if (qtyEl) qtyEl.innerText = updated;

            updateCartSummary();
        }

        // Подсчет сводки корзины
        function updateCartSummary() {
            let total = 0;
            let maxTime = 0;
            let totalCount = 0;

            for (let id in cart) {
                const item = menuData.find(i => i.id == id);
                if (item) {
                    total += item.price * cart[id];
                    totalCount += cart[id];
                    if (item.prepTime > maxTime) maxTime = item.prepTime;
                }
            }

            document.getElementById('totalPrice').innerText = `${total} ₽`;
            document.getElementById('totalTime').innerText = totalCount > 0 
                ? `Время ожидания: ~${maxTime} мин` 
                : `Время ожидания: ~0 мин`;

            document.getElementById('sendOrderBtn').disabled = totalCount === 0;
        }

        // Формирование и отправка заказа в WhatsApp
        function sendOrderToWhatsApp() {
            let message = `🔴 *НОВЫЙ ЗАКАЗ — СТОЛ №${currentTable}*\n`;
            message += `------------------------------\n`;

            let total = 0;
            let maxTime = 0;

            for (let id in cart) {
                const item = menuData.find(i => i.id == id);
                if (item) {
                    const sum = item.price * cart[id];
                    total += sum;
                    if (item.prepTime > maxTime) maxTime = item.prepTime;
                    message += `• *${item.name}* x${cart[id]} = ${sum} ₽\n`;
                }
            }

            message += `------------------------------\n`;
            message += `💰 *Итого к оплате:* ${total} ₽\n`;
            message += `⌛ *Примерное время:* ~${maxTime} мин`;

            const encodedMessage = encodeURIComponent(message);
            const waUrl = `https://wa.me/${targetPhoneNumber}?text=${encodedMessage}`;
            window.open(waUrl, '_blank');
        }

        // Логика Админ-панели
        function openAdminModal() {
            document.getElementById('loginModal').style.display = 'block';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPasswordInput').value;
            if (pass === '54321') {
                closeModal('loginModal');
                document.getElementById('adminModal').style.display = 'block';
            } else {
                alert('Неверный пароль!');
            }
        }

        function saveMenuItem() {
            const name = document.getElementById('itemName').value;
            const price = parseFloat(document.getElementById('itemPrice').value);
            const prepTime = parseInt(document.getElementById('itemPrepTime').value);
            const cat = document.getElementById('itemCat').value;
            const img = document.getElementById('itemImg').value || "https://via.placeholder.com/100?text=FiSHKa";

            if (!name || isNaN(price)) {
                alert('Заполните название и цену!');
                return;
            }

            const newItem = {
                id: Date.now(),
                name,
                price,
                prepTime: prepTime || 15,
                cat,
                img
            };

            menuData.push(newItem);
            localStorage.setItem('fishka_menu', JSON.stringify(menuData));
            alert('Блюдо успешно добавлено!');
            
            // Очистка полей
            document.getElementById('itemName').value = '';
            document.getElementById('itemPrice').value = '';
            
            renderCategories();
        }

        // Генерация 40 QR-кодов для печати
        function generateQRCodes() {
            const container = document.getElementById('qrPrintSection');
            container.innerHTML = '';
            
            // Получаем базовый URL (без параметров)
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const qrCard = document.createElement('div');
                qrCard.className = 'qr-card';
                
                const qrDiv = document.createElement('div');
                const tableUrl = `${baseUrl}?table=${i}`;

                new QRCode(qrDiv, {
                    text: tableUrl,
                    width: 100,
                    height: 100
                });

                qrCard.appendChild(qrDiv);
                
                const label = document.createElement('span');
                label.innerText = `СТОЛ №${i}`;
                qrCard.appendChild(label);

                container.appendChild(qrCard);
            }
        }

        // Стартовая инициализация
        window.onload = () => {
            initTableNumber();
            renderCategories();
        };
    </script>
</body>
</html>
