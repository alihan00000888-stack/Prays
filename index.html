<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фишка - Панель управления заказами и долгами</title>
    <!-- FontAwesome & Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f1115;
            --card-bg: #181b22;
            --accent-gold: #ffb703;
            --accent-orange: #fb8500;
            --accent-cyan: #023e8a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --border-color: #2a2f3d;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER & FISH LOGO */
        header {
            background: rgba(24, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        /* Unique Fish Shape Logo incorporating "ФИШКА" */
        .fish-logo-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #fb8500, #ffb703);
            padding: 10px 32px 10px 24px;
            clip-path: polygon(
                0% 50%, 
                15% 15%, 
                75% 15%, 
                88% 0%, 
                85% 35%, 
                100% 50%, 
                85% 65%, 
                88% 100%, 
                75% 85%, 
                15% 85%
            );
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(251, 133, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .fish-logo-wrapper:hover {
            transform: scale(1.05) rotate(-1deg);
            box-shadow: 0 6px 20px rgba(251, 133, 0, 0.6);
        }

        .fish-eye {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 7px;
            height: 7px;
            background-color: #0f1115;
            border-radius: 50%;
            box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.8);
        }

        .fish-logo-text {
            font-size: 1.6rem;
            font-weight: 900;
            color: #0f1115;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            margin-left: 6px;
        }

        .header-actions {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-orange), var(--accent-gold));
            color: #0f1115;
            font-weight: 700;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* MAIN CONTENT AREA */
        .container {
            max-width: 1300px;
            width: 100%;
            margin: 0 auto;
            padding: 30px 20px;
            flex: 1;
        }

        /* SUMMARY CARDS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .stat-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .stat-info h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .stat-info p {
            font-size: 1.6rem;
            font-weight: 800;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: rgba(255,255,255,0.05);
        }

        /* "ALL ORDERS" SECTION WITH CUSTOM LIVE CUTLERY & PLATE BACKGROUND */
        .orders-section {
            position: relative;
            background-color: #0b0d11;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 25px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* SVG Background Pattern featuring Plates, Forks, and Knives */
        .orders-section::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.07; /* Элегантный фоновый рисунок тарелок, вилок и ножей */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180"><g fill="none" stroke="%23ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><!-- Plate 1 --><circle cx="45" cy="45" r="28"/><circle cx="45" cy="45" r="20" stroke-dasharray="2 2"/><!-- Plate 2 --><circle cx="135" cy="135" r="32"/><circle cx="135" cy="135" r="22"/><!-- Fork 1 --><path d="M 120,25 L 120,40 C 120,45 130,45 130,40 L 130,25 M 125,25 L 125,65 M 120,32 L 130,32"/><!-- Knife 1 --><path d="M 145,25 C 145,25 152,32 145,48 L 145,65 M 145,25 L 145,65"/><!-- Fork 2 (angled) --><g transform="translate(35, 125) rotate(-30)"><path d="M -5,-15 L -5,0 C -5,5 5,5 5,0 L 5,-15 M 0,-15 L 0,25"/></g><!-- Knife 2 (angled) --><g transform="translate(55, 125) rotate(30)"><path d="M 0,-15 C 0,-15 7,-8 0,8 L 0,25"/></g></g></svg>');
            background-repeat: repeat;
            background-size: 180px 180px;
            z-index: 1;
        }

        .section-header {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .section-title i {
            color: var(--accent-orange);
        }

        .filter-bar {
            position: relative;
            z-index: 2;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 220px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 10px 15px 10px 40px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-select {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
        }

        /* TABLE CONTAINER */
        .table-wrapper {
            position: relative;
            z-index: 2;
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(24, 27, 34, 0.85);
            backdrop-filter: blur(5px);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.92rem;
        }

        th {
            background: rgba(30, 35, 45, 0.9);
            padding: 14px 18px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        td {
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            vertical-align: middle;
        }

        tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 700;
            display: inline-block;
            text-transform: uppercase;
        }

        .badge-paid {
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-pending {
            background: rgba(245, 158, 11, 0.15);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .badge-overdue {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-action {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px;
            font-size: 1.1rem;
            transition: color 0.2s;
        }

        .btn-action:hover {
            color: var(--text-main);
        }

        .btn-whatsapp {
            color: #25D366;
            background: rgba(37, 211, 102, 0.1);
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .btn-whatsapp:hover {
            background: #25D366;
            color: #fff;
        }

        /* MODAL WINDOW */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            width: 90%;
            max-width: 500px;
            border-radius: 14px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            transform: translateY(-20px);
            transition: transform 0.3s;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-group input, .form-group select {
            width: 100%;
            background: #0f1115;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--accent-orange);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-cancel {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            header {
                padding: 12px 15px;
            }
            .fish-logo-text {
                font-size: 1.2rem;
            }
            .orders-section {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER / LOGO -->
    <header>
        <div class="logo-container">
            <div class="fish-logo-wrapper" title="Фишка - Сервис заказов">
                <div class="fish-eye"></div>
                <span class="fish-logo-text">ФИШКА</span>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn-primary" onclick="openModal()">
                <i class="fa-solid fa-plus"></i> Новый заказ
            </button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <div class="container">

        <!-- DASHBOARD STATS -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Общая сумма заказов</h3>
                    <p id="stat-total">0 ₽</p>
                </div>
                <div class="stat-icon" style="color: #3b82f6;">
                    <i class="fa-solid fa-wallet"></i>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Оплачено</h3>
                    <p id="stat-paid" style="color: var(--success);">0 ₽</p>
                </div>
                <div class="stat-icon" style="color: var(--success);">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-info">
                    <h3>Остаток долгов</h3>
                    <p id="stat-debt" style="color: var(--danger);">0 ₽</p>
                </div>
                <div class="stat-icon" style="color: var(--danger);">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
            </div>
        </div>

        <!-- ORDERS SECTION (WITH CUSTOM PLATE & CUTLERY BACKGROUND) -->
        <div class="orders-section">
            <div class="section-header">
                <div class="section-title">
                    <i class="fa-solid fa-utensils"></i>
                    <span>Все заказы</span>
                </div>
            </div>

            <!-- FILTERS -->
            <div class="filter-bar">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Поиск по клиенту или блюду/товару..." oninput="renderOrders()">
                </div>
                <select class="filter-select" id="statusFilter" onchange="renderOrders()">
                    <option value="all">Все статусы</option>
                    <option value="paid">Оплачено</option>
                    <option value="pending">В ожидании</option>
                    <option value="overdue">Просрочено</option>
                </select>
            </div>

            <!-- ORDERS TABLE -->
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>№ / Дата</th>
                            <th>Клиент</th>
                            <th>Заказ / Детали</th>
                            <th>Сумма</th>
                            <th>Остаток</th>
                            <th>Статус</th>
                            <th>WhatsApp</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="ordersTableBody">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ADD/EDIT ORDER MODAL -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Добавить новый заказ</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <form id="orderForm" onsubmit="saveOrder(event)">
                <input type="hidden" id="orderId">
                <div class="form-group">
                    <label for="clientName">Имя клиента</label>
                    <input type="text" id="clientName" required placeholder="Например: Магомед">
                </div>
                <div class="form-group">
                    <label for="clientPhone">Телефон (для WhatsApp)</label>
                    <input type="tel" id="clientPhone" required placeholder="79991112233">
                </div>
                <div class="form-group">
                    <label for="orderDetails">Состав заказа</label>
                    <input type="text" id="orderDetails" required placeholder="Например: Сет Ассорти + Напитки">
                </div>
                <div class="form-group">
                    <label for="totalAmount">Сумма заказа (₽)</label>
                    <input type="number" id="totalAmount" required min="0" placeholder="3500">
                </div>
                <div class="form-group">
                    <label for="paidAmount">Внесено / Оплачено (₽)</label>
                    <input type="number" id="paidAmount" required min="0" placeholder="1000">
                </div>
                <div class="form-group">
                    <label for="orderStatus">Статус оплаты</label>
                    <select id="orderStatus">
                        <option value="paid">Оплачено полностью</option>
                        <option value="pending">Частичная оплата / В ожидании</option>
                        <option value="overdue">Долг / Просрочено</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // INITIAL DEMO DATA
        let orders = JSON.parse(localStorage.getItem('fishka_orders')) || [
            {
                id: '101',
                date: '2026-09-12',
                client: 'Арсен',
                phone: '79281234567',
                details: 'Банкетный сет #2 + Рыбное ассорти',
                amount: 8500,
                paid: 8500,
                status: 'paid'
            },
            {
                id: '102',
                date: '2026-09-13',
                client: 'Мурад',
                phone: '79887654321',
                details: '3x Сет Фирменный + Доставка',
                amount: 5200,
                paid: 2000,
                status: 'pending'
            },
            {
                id: '103',
                date: '2026-09-10',
                client: 'Ислам',
                phone: '79630001122',
                details: 'Комбо ужин "Фишка"',
                amount: 3400,
                paid: 0,
                status: 'overdue'
            }
        ];

        function saveToStorage() {
            localStorage.setItem('fishka_orders', JSON.stringify(orders));
        }

        function calculateStats() {
            let total = 0;
            let paid = 0;
            let debt = 0;

            orders.forEach(o => {
                total += Number(o.amount);
                paid += Number(o.paid);
                debt += (Number(o.amount) - Number(o.paid));
            });

            document.getElementById('stat-total').innerText = total.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('stat-paid').innerText = paid.toLocaleString('ru-RU') + ' ₽';
            document.getElementById('stat-debt').innerText = debt.toLocaleString('ru-RU') + ' ₽';
        }

        function renderOrders() {
            const tbody = document.getElementById('ordersTableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const statusFilter = document.getElementById('statusFilter').value;

            tbody.innerHTML = '';

            const filtered = orders.filter(o => {
                const matchesSearch = o.client.toLowerCase().includes(search) || o.details.toLowerCase().includes(search);
                const matchesStatus = statusFilter === 'all' || o.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 30px;">Заказы не найдены</td></tr>`;
                calculateStats();
                return;
            }

            filtered.forEach(o => {
                const remaining = Number(o.amount) - Number(o.paid);
                
                let badgeClass = 'badge-pending';
                let statusText = 'В ожидании';
                if (o.status === 'paid' || remaining <= 0) {
                    badgeClass = 'badge-paid';
                    statusText = 'Оплачен';
                } else if (o.status === 'overdue') {
                    badgeClass = 'badge-overdue';
                    statusText = 'Долг';
                }

                // WhatsApp message construction
                const waMessage = encodeURIComponent(`Здравствуйте, ${o.client}! Касательно вашего заказа "${o.details}": общая сумма ${o.amount} руб., оставшийся остаток к оплате: ${remaining} руб. Спасибо, что выбираете "Фишка"!`);
                const waLink = `https://wa.me/${o.phone.replace(/[^0-9]/g, '')}?text=${waMessage}`;

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>#${o.id}</strong><br><small style="color:var(--text-muted);">${o.date}</small></td>
                    <td><strong>${o.client}</strong><br><small style="color:var(--text-muted);">${o.phone}</small></td>
                    <td>${o.details}</td>
                    <td><strong>${Number(o.amount).toLocaleString('ru-RU')} ₽</strong></td>
                    <td style="color: ${remaining > 0 ? 'var(--danger)' : 'var(--success)'}; font-weight:700;">
                        ${remaining.toLocaleString('ru-RU')} ₽
                    </td>
                    <td><span class="badge ${badgeClass}">${statusText}</span></td>
                    <td>
                        <a href="${waLink}" target="_blank" class="btn-whatsapp">
                            <i class="fa-brands fa-whatsapp"></i> Напомнить
                        </a>
                    </td>
                    <td>
                        <button class="btn-action" onclick="editOrder('${o.id}')" title="Редактировать"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button class="btn-action" onclick="deleteOrder('${o.id}')" title="Удалить"><i class="fa-solid fa-trash" style="color:var(--danger)"></i></button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            calculateStats();
        }

        function openModal(editId = null) {
            const modal = document.getElementById('orderModal');
            const form = document.getElementById('orderForm');
            
            if (editId) {
                const item = orders.find(o => o.id === editId);
                if (item) {
                    document.getElementById('modalTitle').innerText = 'Редактировать заказ #' + item.id;
                    document.getElementById('orderId').value = item.id;
                    document.getElementById('clientName').value = item.client;
                    document.getElementById('clientPhone').value = item.phone;
                    document.getElementById('orderDetails').value = item.details;
                    document.getElementById('totalAmount').value = item.amount;
                    document.getElementById('paidAmount').value = item.paid;
                    document.getElementById('orderStatus').value = item.status;
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Добавить новый заказ';
                form.reset();
                document.getElementById('orderId').value = '';
            }

            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        function saveOrder(e) {
            e.preventDefault();
            const id = document.getElementById('orderId').value;
            const client = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const details = document.getElementById('orderDetails').value;
            const amount = Number(document.getElementById('totalAmount').value);
            const paid = Number(document.getElementById('paidAmount').value);
            const status = document.getElementById('orderStatus').value;

            if (id) {
                // Update
                const idx = orders.findIndex(o => o.id === id);
                if (idx !== -1) {
                    orders[idx] = { ...orders[idx], client, phone, details, amount, paid, status };
                }
            } else {
                // Create
                const newId = String(Date.now()).slice(-4);
                const date = new Date().toISOString().split('T')[0];
                orders.unshift({ id: newId, date, client, phone, details, amount, paid, status });
            }

            saveToStorage();
            renderOrders();
            closeModal();
        }

        function editOrder(id) {
            openModal(id);
        }

        function deleteOrder(id) {
            if (confirm('Вы уверены, что хотите удалить этот заказ?')) {
                orders = orders.filter(o => o.id !== id);
                saveToStorage();
                renderOrders();
            }
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', () => {
            renderOrders();
        });
    </script>
</body>
</html>
