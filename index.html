<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FiSHKA — Меню и Заказ</title>
    <!-- Подключение QR-библиотеки для генерирования кодов высокого качества -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --accent-color: #ff9f0a;
            --text-main: #f2f2f7;
            --text-sub: #a1a1a6;
            --border-color: #2c2c30;
            --danger-color: #ff453a;
            --success-color: #30d158;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 90px;
        }

        /* HEADER & LOGO */
        header {
            background: linear-gradient(180deg, #1c1c1e 0%, var(--bg-color) 100%);
            padding: 20px 16px 10px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
        }

        /* ===== ЛОГОТИП-АКУЛА ===== */
        .shark-logo {
            display: block;
            width: 100%;
            max-width: 340px;
            height: auto;
            margin: 0 auto 4px;
            filter: drop-shadow(0 6px 14px rgba(255, 159, 10, 0.35));
        }

        /* Анимации */
        .shark-body-g {
            animation: sharkSwim 4s ease-in-out infinite;
            transform-origin: 50% 60%;
        }
        @keyframes sharkSwim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-2px) rotate(-0.8deg); }
        }

        .shark-tail-g {
            animation: tailSwish 1.8s ease-in-out infinite;
            transform-origin: 250px 75px;
        }
        @keyframes tailSwish {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(9deg); }
        }

        .shark-fin-g {
            animation: finWiggle 2.4s ease-in-out infinite;
            transform-origin: 170px 55px;
        }
        @keyframes finWiggle {
            0%, 100% { transform: rotate(0deg); }
            50% { transform: rotate(-4deg); }
        }

        .shark-eye {
            animation: sharkBlink 5s infinite;
            transform-origin: center;
        }
        @keyframes sharkBlink {
            0%, 92%, 100% { transform: scaleY(1); }
            95% { transform: scaleY(0.1); }
        }

        .bubble {
            animation: bubbleUp 5s ease-in infinite;
            opacity: 0;
        }
        .bubble:nth-of-type(1) { animation-delay: 0.5s; }
        .bubble:nth-of-type(2) { animation-delay: 2s; }
        .bubble:nth-of-type(3) { animation-delay: 3.5s; }
        @keyframes bubbleUp {
            0% { opacity: 0; transform: translate(0, 0); }
            15% { opacity: 0.9; }
            100% { opacity: 0; transform: translate(-10px, -45px); }
        }

        .table-badge {
            display: inline-block;
            background: var(--accent-color);
            color: #000;
            font-weight: 700;
            font-size: 13px;
            padding: 4px 12px;
            border-radius: 20px;
            margin-top: 4px;
        }

        /* CATEGORIES NAV */
        .categories-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 12px 16px;
            background-color: var(--bg-color);
            scrollbar-width: none;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-btn {
            background-color: var(--card-bg);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 12px;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-btn.active {
            background-color: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
        }

        /* MENU LIST & CARDS */
        .menu-container {
            padding: 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 20px;
            margin: 16px 0 12px;
            color: var(--text-main);
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        .food-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .food-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2c2c2e;
        }

        .food-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .food-name {
            font-size: 17px;
            font-weight: 700;
        }

        .food-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
        }

        .food-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .food-price {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent-color);
        }

        /* COUNTER CONTROLS */
        .counter-controls {
            display: flex;
            align-items: center;
            background: #2c2c2e;
            border-radius: 10px;
            overflow: hidden;
        }

        .btn-qty {
            background: none;
            border: none;
            color: var(--text-main);
            width: 36px;
            height: 36px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .qty-val {
            padding: 0 8px;
            font-weight: 700;
            font-size: 15px;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
        }

        /* CART FLOATING BAR */
        .cart-bar {
            position: fixed;
            bottom: 16px;
            left: 16px;
            right: 16px;
            max-width: 568px;
            margin: 0 auto;
            background-color: var(--accent-color);
            color: #000;
            border-radius: 16px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 8px 24px rgba(255, 159, 10, 0.3);
            z-index: 99;
            cursor: pointer;
            font-weight: 800;
        }

        /* ADMIN & MODAL STYLES */
        .admin-trigger {
            position: fixed;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            opacity: 0.2;
            font-size: 18px;
            color: #fff;
            z-index: 101;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 200;
            overflow-y: auto;
            padding: 20px 16px;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
        }

        .input-field, select {
            width: 100%;
            padding: 10px;
            margin: 6px 0 12px;
            background: #2c2c2e;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 8px;
        }

        .btn-action {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-close { background: #3a3a3c; color: #fff; }

        .qr-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 16px;
            margin-top: 16px;
        }

        .qr-card {
            background: #fff;
            color: #000;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .qr-card div { margin: 0 auto; }
    </style>
</head>
<body>

    <button class="admin-trigger" onclick="openAdminModal()">⚙️</button>

    <header>
        <!-- ===== РЕАЛИСТИЧНАЯ АКУЛА С НАДПИСЬЮ FiSHKA НА ТЕЛЕ ===== -->
        <svg class="shark-logo" viewBox="0 0 340 160" xmlns="http://www.w3.org/2000/svg" aria-label="FiSHKA — акула">
            <defs>
                <!-- Градиент тела акулы (сверху тёмный, снизу светлый) -->
                <linearGradient id="sharkBody" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#3a3a3c"/>
                    <stop offset="45%" stop-color="#5a5a5e"/>
                    <stop offset="55%" stop-color="#8e8e93"/>
                    <stop offset="100%" stop-color="#d1d1d6"/>
                </linearGradient>
                <!-- Градиент для надписи -->
                <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#ff9f0a"/>
                    <stop offset="100%" stop-color="#ffd60a"/>
                </linearGradient>
                <!-- Градиент для хвоста -->
                <linearGradient id="tailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#5a5a5e"/>
                    <stop offset="100%" stop-color="#2c2c2e"/>
                </linearGradient>
                <!-- Градиент для плавников -->
                <linearGradient id="finGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#4a4a4e"/>
                    <stop offset="100%" stop-color="#2c2c2e"/>
                </linearGradient>
                <!-- Градиент для воды -->
                <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" stop-color="#ff9f0a" stop-opacity="0.6"/>
                    <stop offset="100%" stop-color="#ff9f0a" stop-opacity="0"/>
                </linearGradient>
                <!-- Зубы -->
                <pattern id="teeth" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
                    <polygon points="0,6 3,0 6,6" fill="#fff"/>
                </pattern>
            </defs>

            <!-- Пузырьки -->
            <circle cx="70" cy="45" r="2.5" fill="#ff9f0a" class="bubble"/>
            <circle cx="55" cy="30" r="1.8" fill="#ff9f0a" class="bubble"/>
            <circle cx="85" cy="20" r="2" fill="#ff9f0a" class="bubble"/>

            <!-- ===== ТЕЛО АКУЛЫ ===== -->
            <g class="shark-body-g">
                <!-- Основное тело: торпедообразный силуэт, голова слева, хвост справа -->
                <path d="M 40 90 
                         Q 25 75 30 60 
                         Q 40 45 70 42 
                         Q 110 40 160 45 
                         Q 210 50 250 60 
                         Q 275 68 285 78 
                         Q 275 88 250 95 
                         Q 210 105 160 108 
                         Q 110 110 70 105 
                         Q 45 100 40 90 Z" 
                      fill="url(#sharkBody)" stroke="#1c1c1e" stroke-width="1.5"/>

                <!-- Брюхо (светлая нижняя часть) -->
                <path d="M 45 92 
                         Q 70 100 160 103 
                         Q 220 100 260 92 
                         Q 250 100 220 105 
                         Q 160 110 90 105 
                         Q 55 100 45 92 Z" 
                      fill="#d1d1d6" opacity="0.85"/>

                <!-- ===== ХВОСТОВОЙ ПЛАВНИК (за телом) ===== -->
                <g class="shark-tail-g">
                    <!-- Верхняя лопасть хвоста -->
                    <path d="M 280 70 
                             Q 305 40 325 20 
                             Q 315 45 320 70 
                             Q 300 72 280 78 Z" 
                          fill="url(#tailGrad)" stroke="#1c1c1e" stroke-width="1"/>
                    <!-- Нижняя лопасть хвоста -->
                    <path d="M 280 80 
                             Q 305 100 325 125 
                             Q 315 100 320 82 
                             Q 300 80 280 78 Z" 
                          fill="url(#tailGrad)" stroke="#1c1c1e" stroke-width="1"/>
                </g>

                <!-- ===== СПИННОЙ ПЛАВНИК ===== -->
                <g class="shark-fin-g">
                    <path d="M 140 45 
                             Q 155 8 185 38 
                             Q 175 42 165 44 
                             Q 155 45 140 45 Z" 
                          fill="url(#finGrad)" stroke="#1c1c1e" stroke-width="1"/>
                </g>

                <!-- ===== ГРУДНОЙ ПЛАВНИК (сбоку) ===== -->
                <path d="M 120 100 
                         Q 130 125 155 130 
                         Q 145 118 150 105 Z" 
                      fill="url(#finGrad)" stroke="#1c1c1e" stroke-width="1"/>

                <!-- ===== ВТОРОЙ СПИННОЙ ПЛАВНИК (маленький) ===== -->
                <path d="M 235 62 Q 245 50 255 62 Q 248 62 245 63 Z" 
                      fill="url(#finGrad)" stroke="#1c1c1e" stroke-width="0.8"/>

                <!-- ===== ЖАБРЫ (полосы у головы) ===== -->
                <path d="M 95 55 Q 92 75 95 95" stroke="#2c2c2e" stroke-width="1.2" fill="none" opacity="0.6"/>
                <path d="M 103 53 Q 100 75 103 97" stroke="#2c2c2e" stroke-width="1.2" fill="none" opacity="0.5"/>
                <path d="M 111 52 Q 108 75 111 98" stroke="#2c2c2e" stroke-width="1.2" fill="none" opacity="0.4"/>

                <!-- ===== ГЛАЗ ===== -->
                <g class="shark-eye">
                    <circle cx="60" cy="62" r="5" fill="#000"/>
                    <circle cx="60" cy="62" r="3" fill="#1c1c1e"/>
                    <circle cx="58.5" cy="60.5" r="1.2" fill="#fff"/>
                </g>

                <!-- ===== УЛЫБКА / РОТ С ЗУБАМИ ===== -->
                <path d="M 38 82 Q 55 92 78 88" stroke="#1c1c1e" stroke-width="2" fill="none" stroke-linecap="round"/>
                <!-- Зубы (треугольнички) -->
                <path d="M 42 83 L 45 88 L 48 83" fill="#fff" stroke="#1c1c1e" stroke-width="0.4"/>
                <path d="M 50 84 L 53 89 L 56 84" fill="#fff" stroke="#1c1c1e" stroke-width="0.4"/>
                <path d="M 58 85 L 61 90 L 64 85" fill="#fff" stroke="#1c1c1e" stroke-width="0.4"/>
                <path d="M 66 86 L 69 90 L 72 86" fill="#fff" stroke="#1c1c1e" stroke-width="0.4"/>
            </g>

            <!-- ===== НАДПИСЬ FiSHKA ПОВЕРХ ТЕЛА ===== -->
            <text x="105" y="85" 
                  font-family="'Arial Black', Impact, sans-serif" 
                  font-size="34" 
                  font-weight="900" 
                  fill="url(#textGrad)" 
                  stroke="#1c1c1e" 
                  stroke-width="1"
                  letter-spacing="1"
                  style="paint-order: stroke;"
                  transform="rotate(-2 105 85)">FiSHKA</text>

            <!-- ===== ЛИНИЯ ВОДЫ СВЕРХУ ===== -->
            <path d="M 0 15 Q 60 5 120 15 T 240 15 T 340 15" 
                  stroke="#ff9f0a" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
            <path d="M 0 10 Q 60 0 120 10 T 240 10 T 340 10" 
                  stroke="#ff9f0a" stroke-width="1" fill="none" opacity="0.3" stroke-linecap="round"/>

            <!-- Брызги воды -->
            <circle cx="20" cy="12" r="2" fill="#ff9f0a" opacity="0.6"/>
            <circle cx="300" cy="8" r="1.5" fill="#ff9f0a" opacity="0.5"/>
            <circle cx="150" cy="5" r="1.8" fill="#ff9f0a" opacity="0.4"/>
        </svg>
        <!-- ===== КОНЕЦ АКУЛЫ ===== -->

        <div class="table-badge" id="tableBadge">Столик №1</div>
    </header>

    <nav class="categories-scroll" id="categoriesNav">
        <!-- Категории будут сгенерированы автоматически -->
    </nav>

    <main class="menu-container" id="menuContainer">
        <!-- Меню будет сгенерировано динамически -->
    </main>

    <div class="cart-bar" id="cartBar" style="display: none;" onclick="sendOrderToWhatsApp()">
        <div>
            <span id="cartCount">0</span> позиций
        </div>
        <div>Отправить заказ в WhatsApp ➔</div>
        <div id="cartTotal">0 ₽</div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО АДМИНКИ -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <h2 style="margin-bottom: 12px;">Панель Управления</h2>
            
            <div id="authBlock">
                <p>Введите пароль администратора:</p>
                <input type="password" id="adminPassword" class="input-field" placeholder="Пароль">
                <button class="btn-action" onclick="checkAdminPassword()">Войти</button>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Закрыть</button>
            </div>

            <div id="adminPanel" style="display: none;">
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button class="btn-action" onclick="showAdminTab('editor')">Редактор Меню</button>
                    <button class="btn-action" onclick="showAdminTab('qr')">QR-коды (40 столов)</button>
                </div>

                <!-- Вкладка Редактора -->
                <div id="tabEditor">
                    <h3>Добавить / Изменить блюдо</h3>
                    <input type="hidden" id="editIndex">
                    <input type="text" id="editName" class="input-field" placeholder="Название блюда">
                    <input type="number" id="editPrice" class="input-field" placeholder="Цена (руб)">
                    <input type="text" id="editTime" class="input-field" placeholder="Время готовки (~15 мин)">
                    <select id="editCategory" class="input-field">
                        <!-- Динамически заполняется -->
                    </select>
                    <p style="font-size: 12px; color: var(--text-sub);">Загрузить фото из памяти устройства:</p>
                    <input type="file" id="editImageFile" accept="image/*" class="input-field">
                    
                    <button class="btn-action" onclick="saveFoodItem()">Сохранить позицию</button>
                    <button class="btn-action btn-close" onclick="resetEditForm()">Очистить форму</button>
                    <hr style="border-color: var(--border-color); margin: 16px 0;">
                    
                    <h3>Текущее меню</h3>
                    <div id="adminFoodList" style="margin-top: 10px;"></div>
                </div>

                <!-- Вкладка QR-кодов -->
                <div id="tabQR" style="display: none;">
                    <h3>QR-коды для 40 столиков</h3>
                    <p style="font-size: 12px; color: var(--text-sub); margin-bottom: 10px;">Распечатайте и наклейте на соответствующие столики:</p>
                    <div class="qr-grid" id="qrGrid"></div>
                </div>

                <br>
                <button class="btn-action btn-close" onclick="closeAdminModal()">Выйти из админки</button>
            </div>
        </div>
    </div>

    <script>
        // ИНИЦИАЛИЗАЦИЯ ДАННЫХ
        const PHONE_NUMBER = "79681755402";
        
        const initialMenu = [
            { name: "Горячий шик", price: 300, time: "~15-20 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?w=500" },
            { name: "Филадельфия", price: 300, time: "~15 мин", cat: "Роллы", img: "https://images.unsplash.com/photo-1611143669185-af224c5e3252?w=500" },
            { name: "Гамбургер куриный", price: 130, time: "~10 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500" },
            { name: "Хот-дог", price: 120, time: "~7 мин", cat: "Фаст-Фуд", img: "https://images.unsplash.com/photo-1619740455993-9e612b1af08a?w=500" },
            { name: "Шаурма", price: 200, time: "~10 мин", cat: "Восточная кухня", img: "https://images.unsplash.com/photo-1561651823-34feb02250e4?w=500" },
            { name: "Цезарь с курицей", price: 300, time: "~12 мин", cat: "Салаты", img: "https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=500" },
            { name: "Американо", price: 150, time: "~5 мин", cat: "Напитки", img: "https://images.unsplash.com/photo-1514432324607-a09d9b4aefdd?w=500" }
        ];

        let menuData = JSON.parse(localStorage.getItem('fishka_menu')) || initialMenu;
        let cart = {};
        let activeCategory = "Все";
        let currentTable = 1;

        // ПОЛУЧЕНИЕ НОМЕРА СТОЛА ИЗ URL (?table=N)
        function initTableNumber() {
            const urlParams = new URLSearchParams(window.location.search);
            const tableParam = urlParams.get('table');
            if (tableParam) {
                currentTable = tableParam;
            }
            document.getElementById('tableBadge').innerText = `Столик №${currentTable}`;
        }

        // РЕНДЕР КАТЕГОРИЙ И МЕНЮ
        function renderCategories() {
            const categories = ["Все", ...new Set(menuData.map(item => item.cat))];
            const nav = document.getElementById('categoriesNav');
            nav.innerHTML = categories.map(cat => `
                <button class="cat-btn ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>
            `).join('');

            // Заполнение категорий в админке
            const editCatSelect = document.getElementById('editCategory');
            editCatSelect.innerHTML = categories.filter(c => c !== "Все").map(c => `<option value="${c}">${c}</option>`).join('');
            editCatSelect.innerHTML += `<option value="Новая">+ Добавить новую категорию</option>`;
        }

        function setCategory(cat) {
            activeCategory = cat;
            renderCategories();
            renderMenu();
        }

        function renderMenu() {
            const container = document.getElementById('menuContainer');
            const filtered = activeCategory === "Все" ? menuData : menuData.filter(i => i.cat === activeCategory);

            container.innerHTML = filtered.map((item, idx) => {
                const globalIndex = menuData.indexOf(item);
                const qty = cart[globalIndex] || 0;

                return `
                <div class="food-card">
                    <img src="${item.img}" class="food-img" alt="${item.name}">
                    <div class="food-info">
                        <div class="food-name">${item.name}</div>
                        <div class="food-meta">
                            <span>⏱ ${item.time || '~15 мин'}</span>
                            <span>Категория: ${item.cat}</span>
                        </div>
                        <div class="food-bottom">
                            <div class="food-price">${item.price} ₽</div>
                            ${qty > 0 ? `
                                <div class="counter-controls">
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, -1)">-</button>
                                    <span class="qty-val">${qty}</span>
                                    <button class="btn-qty" onclick="updateQty(${globalIndex}, 1)">+</button>
                                </div>
                            ` : `
                                <button class="btn-add" onclick="updateQty(${globalIndex}, 1)">Добавить</button>
                            `}
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        // КОРЗИНА И ОБНОВЛЕНИЕ ПОРЦИЙ
        function updateQty(index, delta) {
            cart[index] = (cart[index] || 0) + delta;
            if (cart[index] <= 0) delete cart[index];
            renderMenu();
            updateCartBar();
        }

        function updateCartBar() {
            const cartBar = document.getElementById('cartBar');
            let totalCount = 0;
            let totalPrice = 0;

            for (let idx in cart) {
                totalCount += cart[idx];
                totalPrice += cart[idx] * menuData[idx].price;
            }

            if (totalCount > 0) {
                cartBar.style.display = 'flex';
                document.getElementById('cartCount').innerText = totalCount;
                document.getElementById('cartTotal').innerText = `${totalPrice} ₽`;
            } else {
                cartBar.style.display = 'none';
            }
        }

        // ОТПРАВКА В WHATSAPP
        function sendOrderToWhatsApp() {
            let orderText = `📍 *ЗАКАЗ — СТОЛИК №${currentTable}*\n\n`;
            let totalPrice = 0;

            for (let idx in cart) {
                const item = menuData[idx];
                const itemTotal = item.price * cart[idx];
                totalPrice += itemTotal;
                orderText += `• ${item.name} x${cart[idx]} = ${itemTotal} ₽\n`;
            }

            orderText += `\n💰 *Итого к оплате:* ${totalPrice} ₽`;

            const encodedText = encodeURIComponent(orderText);
            window.open(`https://wa.me/${PHONE_NUMBER}?text=${encodedText}`, '_blank');
        }

        // АДМИНКА И ПАРОЛЬ
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeAdminModal() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function checkAdminPassword() {
            const pass = document.getElementById('adminPassword').value;
            if (pass === "54321") {
                document.getElementById('authBlock').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminFoodList();
                generateQRCodes();
            } else {
                alert("Неверный пароль!");
            }
        }

        function showAdminTab(tab) {
            document.getElementById('tabEditor').style.display = tab === 'editor' ? 'block' : 'none';
            document.getElementById('tabQR').style.display = tab === 'qr' ? 'block' : 'none';
        }

        // РЕДАКТИРОВАНИЕ И СОХРАНЕНИЕ
        function saveFoodItem() {
            const name = document.getElementById('editName').value;
            const price = parseFloat(document.getElementById('editPrice').value);
            const time = document.getElementById('editTime').value;
            let cat = document.getElementById('editCategory').value;
            const fileInput = document.getElementById('editImageFile');
            const editIndex = document.getElementById('editIndex').value;

            if (cat === "Новая") {
                cat = prompt("Введите название новой категории:");
                if (!cat) return;
            }

            if (!name || !price) {
                alert("Заполните имя и цену!");
                return;
            }

            const processSave = (imgUrl) => {
                const itemObj = {
                    name, price, time: time || "~15 мин", cat,
                    img: imgUrl || (editIndex !== "" ? menuData[editIndex].img : "https://via.placeholder.com/300")
                };

                if (editIndex !== "") {
                    menuData[editIndex] = itemObj;
                } else {
                    menuData.push(itemObj);
                }

                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                resetEditForm();
                renderCategories();
                renderMenu();
                renderAdminFoodList();
                alert("Сохранено!");
            };

            if (fileInput.files && fileInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    processSave(e.target.result); // Конвертация файла в DataURL
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                processSave(null);
            }
        }

        function renderAdminFoodList() {
            const container = document.getElementById('adminFoodList');
            container.innerHTML = menuData.map((item, idx) => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#2c2c2e; padding:8px; margin-bottom:6px; border-radius:8px;">
                    <div><strong>${item.name}</strong> (${item.price} ₽)</div>
                    <div>
                        <button style="padding:4px 8px;" onclick="editFoodItem(${idx})">✏️</button>
                        <button style="padding:4px 8px; background:var(--danger-color); color:#fff; border:none; border-radius:4px;" onclick="deleteFoodItem(${idx})">🗑</button>
                    </div>
                </div>
            `).join('');
        }

        function editFoodItem(idx) {
            const item = menuData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('editName').value = item.name;
            document.getElementById('editPrice').value = item.price;
            document.getElementById('editTime').value = item.time;
            document.getElementById('editCategory').value = item.cat;
        }

        function deleteFoodItem(idx) {
            if (confirm("Удалить это блюдо?")) {
                menuData.splice(idx, 1);
                localStorage.setItem('fishka_menu', JSON.stringify(menuData));
                renderCategories();
                renderMenu();
                renderAdminFoodList();
            }
        }

        function resetEditForm() {
            document.getElementById('editIndex').value = "";
            document.getElementById('editName').value = "";
            document.getElementById('editPrice').value = "";
            document.getElementById('editTime').value = "";
            document.getElementById('editImageFile').value = "";
        }

        // ГЕНЕРАЦИЯ 40 QR-КОДОВ
        function generateQRCodes() {
            const grid = document.getElementById('qrGrid');
            grid.innerHTML = "";
            const baseUrl = window.location.href.split('?')[0];

            for (let i = 1; i <= 40; i++) {
                const card = document.createElement('div');
                card.className = 'qr-card';
                card.innerHTML = `<div id="qr_${i}"></div><strong style="margin-top:4px; display:block;">Стол №${i}</strong>`;
                grid.appendChild(card);

                new QRCode(document.getElementById(`qr_${i}`), {
                    text: `${baseUrl}?table=${i}`,
                    width: 100,
                    height: 100
                });
            }
        }

        // СТАРТ
        initTableNumber();
        renderCategories();
        renderMenu();
    </script>
</body>
</html>
